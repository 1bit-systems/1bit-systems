# packages.toml — 1bit-systems component version manifest
#
# Mirrors the Lemonade v10.3 `*_bin` config shape:
#   builtin   = use the version bundled with the repo
#   latest    = auto-update to the latest upstream release
#   <tag>     = pin to a specific git tag or release version
#   <path>    = use a local build at the given filesystem path
#
# Pattern source: lemonade-sdk/lemonade#1713 (@jeremyfowers)
# Tracking: https://github.com/bong-water-water-bong/1bit-systems/issues/2

[components]

# ── NPU Inference Engine ─────────────────────────────────────────
# C++ engine: bitnet_decode ternary GEMV + fused kernels for Strix Halo NPU

[npu_engine]
version = "/home/bcloud/npu-sandbox/npu-infer/build/"
description = "NPU inference engine (npu_engine_mt) — BitNet ternary GEMM + fused attention"
upstream = "https://github.com/bong-water-water-bong/1bit-systems"
build_command = "cmake -B build -S npu-infer && cmake --build build"

# ── Tokenizer ────────────────────────────────────────────────────

[tokenizer]
version = "/home/bcloud/npu-sandbox/npu-infer/build/"
description = "SentencePiece tokenizer for Qwen3-0.6B vocabulary"
upstream = "https://github.com/bong-water-water-bong/1bit-systems"
build_command = "cmake -B build -S npu-infer && cmake --build build"

# ── Lemonade ML (FLM) ────────────────────────────────────────────

[flm]
version = "0.9.44"
description = "Lemonade ML runtime — OpenAI-compatible model serving"
upstream = "https://github.com/lemonade-sdk/lemonade"
install_command = "pip install lemonade-ml"

# ── Triton-XDNA (AMD NPU compiler) ───────────────────────────────

[triton_xdna]
version = "builtin"
description = "AMD NPU kernel compiler (Triton backend for Ryzen AI)"
upstream = "https://github.com/amd/triton-xdna"
note = "Submodule — pinned in .gitmodules, built as part of CMake tree"

# ── Models ───────────────────────────────────────────────────────

[models.qwen3_0_6b_npu]
version = "Qwen3-0.6B-NPU2"
description = "Qwen3 0.6B quantized for Strix Halo NPU (q4nx format)"
source = "https://huggingface.co/Qwen/Qwen3-0.6B"
path = "~/.config/flm/models/Qwen3-0.6B-NPU2/"
quantization = "q4nx"
parameters = "0.6B"

# ── Runtime dependencies ─────────────────────────────────────────

[runtime.xrt]
version = "latest"
description = "AMD XRT — NPU runtime library (xrt_coreutil.so)"
upstream = "https://github.com/Xilinx/XRT"
package = "xrt"

[runtime.rocm]
version = "7.x"
description = "AMD ROCm — GPU compute runtime (optional, for iGPU fallback)"
upstream = "https://github.com/ROCm/ROCm"
note = "Source build targeted at gfx1151; not in AMD Tier-1 list"

# ── Development tools ────────────────────────────────────────────

[tools.zig]
version = "0.15.2"
description = "Zig compiler — for ZINC GPU engine builds"
upstream = "https://ziglang.org/download/"

[tools.cmake]
version = "latest"
description = "CMake build system"
