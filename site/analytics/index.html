<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — 1bit.systems</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; --green:#3fb950; --blue:#58a6ff; --orange:#d2991d; --red:#f85149; --purple:#a371f7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); padding:24px; max-width:1200px; margin:0 auto; }
  h1 { font-size:28px; margin-bottom:4px; }
  .subtitle { color:var(--muted); font-size:14px; margin-bottom:24px; }
  h2 { font-size:18px; margin-bottom:12px; color:var(--blue); border-bottom:1px solid var(--border); padding-bottom:6px; }
  .grid { display:grid; gap:16px; margin-bottom:24px; }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .card .value { font-size:28px; font-weight:700; }
  .card .value.green { color:var(--green); }
  .card .value.blue { color:var(--blue); }
  .card .value.orange { color:var(--orange); }
  .card .value.purple { color:var(--purple); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid var(--border); font-size:14px; }
  .bar { display:inline-block; height:20px; background:var(--green); border-radius:3px; vertical-align:middle; }
  .bar-wrap { display:flex; align-items:center; gap:8px; }
  .bar-wrap .num { font-variant-numeric:tabular-nums; min-width:80px; text-align:right; font-size:13px; }
  .country-flag { margin-right:6px; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .avatar { width:24px; height:24px; border-radius:50%; vertical-align:middle; margin-right:6px; }
  .stargazers { display:flex; flex-wrap:wrap; gap:10px; }
  .stargazer { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 12px; }
  .chart { width:100%; height:200px; position:relative; }
  .chart-bars { display:flex; align-items:flex-end; gap:2px; height:180px; padding:0 4px; }
  .chart-bar { flex:1; background:var(--green); border-radius:2px 2px 0 0; min-width:6px; position:relative; transition:opacity .2s; cursor:pointer; }
  .chart-bar:hover { opacity:.7; }
  .chart-labels { display:flex; justify-content:space-between; margin-top:4px; font-size:10px; color:var(--muted); }
  .tab { display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .tab-btn { padding:8px 16px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
  .tab-btn.active { color:var(--text); border-bottom-color:var(--green); }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  @media (max-width:768px) { .grid-4 { grid-template-columns:repeat(2,1fr); } .grid-2 { grid-template-columns:1fr; } }
</style>
</head>
<body>

<h1>📊 1bit.systems Analytics</h1>
<p class="subtitle">14-day window: <span id="period"></span> · Updated: <span id="updated"></span></p>

<div class="grid grid-4" id="summary-grid"></div>

<div class="tab">
  <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
  <button class="tab-btn" onclick="switchTab('daily')">Daily Trends</button>
  <button class="tab-btn" onclick="switchTab('geo')">Geography</button>
  <button class="tab-btn" onclick="switchTab('stargazers')">Stargazers</button>
  <button class="tab-btn" onclick="switchTab('technical')">Technical</button>
</div>

<div id="tab-overview" class="tab-content active">
  <div class="grid grid-2" id="overview-charts"></div>
</div>

<div id="tab-daily" class="tab-content">
  <div class="grid grid-2" id="daily-charts"></div>
</div>

<div id="tab-geo" class="tab-content">
  <div class="grid grid-2" id="geo-charts"></div>
</div>

<div id="tab-stargazers" class="tab-content">
  <div id="stargazers-list"></div>
</div>

<div id="tab-technical" class="tab-content">
  <div class="grid grid-2" id="tech-charts"></div>
</div>

<script>

// Render
document.getElementById('period').textContent = '2026-06-25 → 2026-07-08';
document.getElementById('updated').textContent = new Date().toISOString().split('T')[0];

// Summary grid
document.getElementById('summary-grid').innerHTML = [
  {l:'GitHub Stars',v:ghRepo.stars,c:'orange'},
  {l:'GitHub Forks',v:ghRepo.forks,c:'blue'},

  {l:'CF Unique Visitors',v:fmt(cfSummary.uniques),c:'purple'},
  {l:'CF Bandwidth',v:cfSummary.bandwidth+' MB',c:'orange'},

// Bar chart helper
function barChart(title,data,key,color,formatter){
  const max=Math.max(...data.map(d=>d[key]));
  const bars=data.map(d=>`<div class="chart-bar" style="height:${(d[key]/max*100).toFixed(0)}%;background:${color}" title="${d.date||d.label}: ${formatter(d[key])}"></div>`).join('');
  const labels=data.map(d=>{
    const t=d.date||d.label||'';
    return `<span>${t.length>5?t.slice(5):t}</span>`;
  }).join('');
  return `<div class="card"><div class="label">${title}</div><div class="chart-bars">${bars}</div><div class="chart-labels">${labels}</div></div>`;
}

// Horizontal bar chart
function hbarChart(title,data,key,labelKey,color,formatter){
  const max=Math.max(...data.map(d=>d[key]));
  return `<div class="card"><div class="label" style="margin-bottom:8px">${title}</div>${data.map(d=>`
    <div class="bar-wrap" style="margin-bottom:4px">
      <span style="font-size:12px;min-width:${title.includes('Country')?'36px':'80px'}">${d[labelKey]||d.label||''}</span>
      <div style="flex:1;background:#21262d;border-radius:3px;height:18px">
        <div class="bar" style="width:${(d[key]/max*100).toFixed(0)}%;background:${color}"></div>
      </div>
      <span class="num">${formatter(d[key])}</span>
    </div>`).join('')}</div>`;
}

document.getElementById('overview-charts').innerHTML =

  barChart('Daily GitHub Views',ghViews.views,'count',BLUE,fmt) +

document.getElementById('stargazers-list').innerHTML =
  `<h2 style="margin-bottom:12px">${ghStargazers.length} Stargazers</h2>

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}
</script>
</body>
</html>
