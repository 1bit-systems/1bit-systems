type: object
required:
  - type
  - title
  - description
  - timestamp
properties:
  type:
    type: string
    description: "Must be 'Engine'"
  title:
    type: string
    description: "Human-readable engine name"
  description:
    type: string
    description: "One-line summary"
  resource:
    type: string
    description: "Source path or URL"
  tags:
    type: array
    items:
      type: string
  timestamp:
    type: string
    description: "ISO 8601 datetime"
