ne/fusion/", "tags": ["npu", "gpu", "fusion", "hybrid", "zig", "dispatcher"], "color": "#8b5cf6", "size": 40}}, {"data": {"id": "engines/npu_engine", "label": "NPU Inference Engine (C++ v12)", "type": "Engine", "description": "Production inference engine on AMD NPU via XRT. 97 tok/s Qwen3-0.6B, 10.3 ms/tok decode.", "resource": "https://github.com/1bit-systems/1bit/tree/main/engine/npu/", "tags": ["npu", "production", "cpp", "xrt", "int8", "q4nx"], "color": "#8b5cf6", "size": 41}}, {"data": {"id": "engines/rocm_backend", "label": "ROCm Custom Kernel Backend", "type": "Engine", "description": "Custom HIP kernels for 1-bit and ternary inference on AMD Strix Halo (gfx1151), folded into zaya-llama.cpp as ggml-rocm backend.", "resource": "https://github.com/1bit-systems/zaya-llama.cpp/tree/main/ggml/src/ggml-rocm/", "tags": ["rocm", "hip", "gpu", "ternary", "1-bit", "ggml", "kernels"], "color": "#8b5cf6", "size": 36}}, {"data": {"id": "engines/unified_daemon", "label": "Unified Serving Daemon", "type": "Engine", "description": "Single 38 KB fused engine binary serving all models via a HTTP API (OpenAI-compatible), proxying through C++ v12 (NPU) or FLM fallback.", "resource": "https://github.com/1bit-systems/1bit/tree/main/npu-gpu-cpu/", "tags": ["daemon", "serving", "api", "openai-compatible", "http"], "color": "#8b5cf6", "size": 36}}, {"data": {"id": "references/dispatch_policies", "label": "Fused Engine Dispatch Policies", "type": "Reference", "description": "8 dispatch policies for per-layer routing between NPU (XRT INT8 GEMM) and GPU (Vulkan flash attention/DMMV).", "resource": "", "tags": ["fusion", "dispatch", "policies", "npu", "gpu"], "color": "#10b981", "size": 38}}, {"data": {"id": "references/gpu_benchmarks", "label": "GPU 1-Bit Model Benchmarks", "type": "Reference", "description": "All 1-bit/ternary models tested on Radeon 8060S (Vulkan) at \u22641.5625 bpw. Measured via llama.cpp/ZINC, 3 repetitions.", "resource": "", "tags": ["benchmarks", "gpu", "vulkan", "1-bit", "ternary", "radeon"], "color": "#10b981", "size": 35}}, {"data": {"id": "references/performance_benchmarks", "label": "Performance Benchmarks (July 2026)", "type": "Reference", "description": "Source-of-truth benchmark results across all engines \u2014 NPU C++ v12, FLM fallback, GPU Vulkan, ROCm \u2014 from the July 6, 2026 refresh.", "resource": "https://github.com/1bit-systems/1bit/blob/main/docs/wiki/performance.md", "tags": ["benchmarks", "performance", "npu", "gpu", "rocm"], "color": "#10b981", "size": 36}}, {"data": {"id": "structures/kv_cache", "label": "Unified KV Cache (H2O Eviction)", "type": "Structure", "description": "Backend-agnostic KV cache with H2O eviction, RadixAttention prefix sharing, CPU offloading, and dynamic quantization profiles.", "resource": "https://github.com/1bit-systems/1bit/tree/main/engine/gpu/src/scheduler/", "tags": ["kv-cache", "h2o", "radix-attention", "scheduler", "zig"], "color": "#3b82f6", "size": 40}}, {"data": {"id": "structures/zaya_architecture", "label": "Zaya Model Architecture", "type": "Structure", "description": "Hybrid CCA-attention + Mixture-of-Experts with EDA router. Supported in zaya-llama.cpp with custom ROCm kernels.", "resource": "", "tags": ["zaya", "architecture", "moe", "cca", "eda", "router", "ternary"], "color": "#3b82f6", "size": 37}}], "edges": [{"data": {"id": "AGENTS__.agents/guidelines/knowledge-base.guidelines", "source": "AGENTS", "target": ".agents/guidelines/knowledge-base.guidelines"}}, {"data": {"id": "engines/fused_engine__references/dispatch_policies", "source": "engines/fused_engine", "target": "references/dispatch_policies"}}, {"data": {"id": "engines/fused_engine__structures/kv_cache", "source": "engines/fused_engine", "target": "structures/kv_cache"}}, {"data": {"id": "engines/npu_engine__references/performance_benchmarks", "source": "engines/npu_engine", "target": "references/performance_benchmarks"}}, {"data": {"id": "engines/rocm_backend__references/gpu_benchmarks", "source": "engines/rocm_backend", "target": "references/gpu_benchmarks"}}, {"data": {"id": "engines/rocm_backend__structures/zaya_architecture", "source": "engines/rocm_backend", "target": "structures/zaya_architecture"}}, {"data": {"id": "engines/unified_daemon__engines/npu_engine", "source": "engines/unified_daemon", "target": "engines/npu_engine"}}, {"data": {"id": "engines/unified_daemon__engines/fused_engine", "source": "engines/unified_daemon", "target": "engines/fused_engine"}}, {"data": {"id": "references/dispatch_policies__engines/fused_engine", "source": "references/dispatch_policies", "target": "engines/fused_engine"}}, {"data": {"id": "references/dispatch_policies__structures/kv_cache", "source": "references/dispatch_policies", "target": "structures/kv_cache"}}, {"data": {"id": "references/performance_benchmarks__references/gpu_benchmarks", "source": "references/performance_benchmarks", "target": "references/gpu_benchmarks"}}, {"data": {"id": "structures/kv_cache__engines/fused_engine", "source": "structures/kv_cache", "target": "engines/fused_engine"}}, {"data": {"id": "structures/zaya_architecture__engines/rocm_backend", "source": "structures/zaya_architecture", "target": "engines/rocm_backend"}}], "bodies": {".agents/guidelines/knowledge-base.guidelines": "# Knowledge Base Maintenance Guidelines\n\n`knowledge/` is an [OKF](https://github.com/gsemet/okf-schema) bundle. Each `.md`\nfile has a `type` in its frontmatter that maps to a schema in `_schema/`. This\ndocument is the strict minimal rule set for maintaining it correctly.\n\n## 1. Choose the right type\n\n| You want to record\u2026 | type | Folder | Layer | Nature |\n|---------------------|------|--------|-------|--------|\n| A raw observation at time T | `Finding` | `findings/` | Storage | Empirical, immutable |\n| A testable idea to validate | `Hypothesis` | `hypotheses/` | Testing | Testable, mutable |\n| A reusable test procedure | `Experiment` | `experiments/` | Testing | Template, run 1\u20132\u00d7 |\n| A stable idea / \"what is this?\" | `Concept` | `concepts/` | Semantic | Explanatory, mutable |\n| How an object is composed / works | `Structure` | `structures/` | Semantic | Descriptive, mutable |\n| A human-agreed standard | `Principle` | `principles/` | Governance | Normative, stable |\n| A reproducible workflow | `Playbook` | `guides/` | Operational | Procedural, mutable |\n| A planned deliverable | `Outcome` | `outcomes/` | Planning | Goal-oriented, mutable |\n| External papers, lookup tables | `Reference` | `reference/` | Lookup | Lookup, immutable |\n\nRules of thumb:\n\n- Document only what is **non-trivial** for coding agents. Do not paraphrase code\n  or existing docs \u2014 link instead.\n- Keep each file focused and concise, important information first.\n- Findings are the empirical layer; Hypotheses and Experiments are the testing\n  layer; Concepts and Structures are the semantic layer; Principles are the\n  governance layer; Playbooks are the operational layer; Outcomes are the\n  planning layer; References are the lookup layer.\n- Agents dump Findings freely; stable docs are promoted deliberately by the\n  `consolidate-knowledge-base` skill \u2014 never dumped ad hoc.\n- Hypotheses are promoted to Concept or Structure by human decision, never\n  automatically.\n- Falsified Hypotheses remain in the knowledge base with `status: falsified`.\n- Playbooks are experienced until proven false; use `superseded_by` when a\n  better workflow emerges.\n- Outcomes track progress and may reference Playbooks for execution.\n\n## 2. Required frontmatter\n\nAll documents (except `index.md` and `log.md`) require:\n\n```yaml\ntype: <one of the types above>   # must match the const in _schema/<Type>.schema.yaml\ntitle: Human-Readable Title       # non-empty\ndescription: Short summary.        # non-empty\ntags: [keyword]                    # optional but encouraged\ntimestamp: 2026-07-02T00:00:00Z   # ISO 8601 (YYYY-MM-DDTHH:MM:SSZ)\n```\n\nType-specific required fields:\n\n- **Finding**: also `timestamp`, `confidence` (`low|medium|high`), and `context`\n  (what you believed and the scope you actually tested).\n- **Experiment**: also `hypothesis` and `steps`.\n\n## 3. Finding immutability & contradictions\n\n- A Finding's **body and claim are frozen** once written. Never reword or delete.\n- To correct a Finding, write a NEW Finding with `contradicts: [<old-id>]` or\n  `supersedes: [<old-id>]`.\n- The only permitted edits to an existing Finding are the lifecycle fields\n  `status` (`contradicted|superseded`), `contradicted_by`, `superseded_by`,\n  appended by the `consolidate-knowledge-base` review.\n- Promotion of converged Findings into Concept/Structure/Principle is done by\n  `consolidate-knowledge-base` with human confirmation \u2014 Principles are always\n  agreed with humans.\n\n## 4. Skills\n\n- **`record-finding`** (fast, non-interactive): dump one Finding after an\n  investigation or debugging session.\n- **`consolidate-knowledge-base`** (interactive, human-confirmed): detect\n  contradictions, mark findings, propose Experiments, propose promotions.\n\n## 5. Validate before commit\n\n```bash\njust knowledge-lint          # auto-format frontmatter + rebuild index\njust knowledge-validate      # 0 errors, 0 warnings required\njust knowledge-lint-check    # verify no pending format changes\n```\n\nPre-commit checklist:\n\n- [ ] Correct `type` and folder for the information recorded.\n- [ ] Required frontmatter present and valid.\n- [ ] No Finding body was reworded or deleted.\n- [ ] All three commands above pass (also covered by `just preflight`).\n\nAdd a dated entry to `knowledge/log.md` for significant changes. Use plain\nISO-8601 date headings; avoid parenthetical annotations (they trigger warnings).", ".agents/skills/consolidate-knowledge-base/SKILL": "# consolidate-knowledge-base\n\nTurn a pile of dated Findings into consolidated, trustworthy knowledge \u2014 without\never rewriting history. This skill is **interactive**: it proposes, the human\nconfirms, then it writes.\n\n## When to use\n\n- After a batch of Findings has been dumped by `record-finding`.\n- Periodically, to keep the empirical layer coherent with the stable layer.\n- When you suspect two findings disagree.\n\n## Guardrails\n\n- NEVER edit or delete a Finding's body. Only append lifecycle frontmatter\n  (`status`, `contradicted_by`, `superseded_by`).\n- NEVER promote to a Principle without explicit human confirmation \u2014 principles\n  are agreed with humans.\n- Ask before every write, using `vscode_askQuestions`.\n\n## Procedure\n\n### 1. Scan\nRead `knowledge/findings/`, plus `principles/`, `structures/`, `concepts/`.\nBuild a map of claims, tags, and existing `contradicts`/`supersedes` links.\n\n### 2. Detect contradictions\nIdentify pairs where a newer Finding disagrees with an older Finding, or where a\nFinding conflicts with a Principle/Structure/Concept. Present each candidate\ncontradiction to the human for confirmation.\n\n### 3. Mark (on confirmation)\nFor each confirmed contradiction, append metadata-only fields:\n- On the newer finding: `contradicts: [<old-id>]` (if not already present).\n- On the older finding: `status: contradicted` and `contradicted_by: [<new-id>]`.\nUse the same pattern with `supersedes`/`superseded_by` for replacements.\nThe body of both files stays untouched.\n\n### 4. Propose Experiments\nFor unresolved or low-confidence contradictions, propose a new `Experiment`\ndocument (hypothesis, steps, expected_signals, `max_runs: 1\u20132`) that would\nsettle the question. Write it to `knowledge/experiments/` only on confirmation.\n\n### 5. Propose promotions\nWhen several Findings converge on a stable truth, propose promoting the insight\ninto the stable layer:\n- \"how it works\" \u2192 `Structure` in `structures/`\n- \"the idea\" \u2192 `Concept` in `concepts/`\n- \"the standard/convention\" \u2192 `Principle` in `principles/` (always human-agreed)\nLink the promoted doc back to its supporting findings (`supported_by` /\n`related_concepts`). Write only on confirmation. Findings remain untouched.\n\n### 6. Validate\n```bash\njust knowledge-lint\njust knowledge-validate\n```\nBoth must pass before finishing.\n\n## Output\n\nA short chat summary: contradictions found and marked, experiments proposed,\npromotions made, and any open questions left for a future run.", ".agents/skills/record-finding/SKILL": "# record-finding\n\nRecord ONE Finding: a dated, empirical, falsifiable note of what you observed and\nbelieved right now. Findings can later be wrong \u2014 that is fine. Be truthful about\nthe moment, not about eternal truth.\n\n## When to use\n\n- You just finished an investigation, debugging session, or verification.\n- You learned something non-trivial about how the external world (VS Code,\n  Copilot, pricing, logs) behaves.\n- You want to hand off \"what I found and believed\" for later consolidation.\n\nDo NOT use this to record standards/conventions (that is a Principle), how an\nobject is composed (Structure), or a stable idea (Concept). Those are promoted\ndeliberately by `consolidate-knowledge-base`, not dumped.\n\n## Procedure\n\n1. Write exactly one file to `knowledge/findings/<slug>.md` where `<slug>` is a\n   short hyphenated summary of the claim.\n2. Use this frontmatter (all listed fields are required):\n\n   ```yaml\n   ---\n   type: Finding\n   title: Short claim as a title\n   description: One-sentence summary of the finding.\n   tags: [relevant, keywords]\n   timestamp: <ISO-8601 UTC, e.g. 2026-07-02T14:30:00Z>\n   confidence: low | medium | high\n   context: >-\n     What you believed and the situation at the time \u2014 including assumptions\n     that may later prove wrong, and the scope you actually tested.\n   ---\n   ```\n\n3. In the body, state plainly: what was observed, why it matters, and the\n   caveats / limits of what you verified.\n4. If this finding contradicts or replaces an earlier one, add\n   `contradicts: [<finding-id>]` or `supersedes: [<finding-id>]`. Do NOT edit the\n   older finding \u2014 the `consolidate-knowledge-base` skill handles backlinks.\n5. If a run of an Experiment produced this finding, add `derived_from: <experiment-id>`.\n\n## Immutability\n\nOnce written, never reword or delete a finding's body. This is enforced by the\n`Findings Are Immutable` principle. Corrections happen by writing a NEW finding.\n\n## Validate\n\n```bash\njust knowledge-lint\njust knowledge-validate\n```\n\nBoth must pass. Do not run `consolidate-knowledge-base` here \u2014 dumping stays fast.", "AGENTS": "# AGENTS.md\n\nThis project uses the OKF Knowledge Base tooling.\n\n## Guidelines\n\n- [Knowledge Base Guidelines](.agents/guidelines/knowledge-base.guidelines.md)\n", "engines/fused_engine": "# Overview\n\nThe FusedEngine (`engine/fusion/`) unifies the NPU (XRT xclbin INT8 GEMM) and GPU (Vulkan flash attention/DMMV) inference paths into one shared serving infrastructure. It dispatches per-layer or per-operation to the optimal backend through a single API.\n\n## Architecture\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                  FusedEngine                      \u2502\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502\n\u2502  \u2502 dispatcher \u2502  \u2502  memory    \u2502  \u2502  interop   \u2502 \u2502\n\u2502  \u2502 .zig       \u2502  \u2502  .zig      \u2502  \u2502  .zig      \u2502 \u2502\n\u2502  \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524  \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524  \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502\n\u2502  \u2502 8 policies \u2502  \u2502 dma-buf    \u2502  \u2502 KV cache   \u2502 \u2502\n\u2502  \u2502 auto-route \u2502  \u2502 staging cp \u2502  \u2502 sync bridge\u2502 \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2502\n\u2502  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502\n\u2502  \u2502  server    \u2502  \u2502   main     \u2502  \u2502  KV cache  \u2502 \u2502\n\u2502  \u2502  .zig      \u2502  \u2502   .zig     \u2502  \u2502  sched/    \u2502 \u2502\n\u2502  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n## Components\n\n- `engine.zig` \u2014 Unified `FusedEngine` wrapping NPU + GPU backends\n- `dispatcher.zig` \u2014 Layer-level dispatch policy (8 policies)\n- `memory.zig` \u2014 Cross-backend memory sharing (dma-buf or staging copy)\n- `interop.zig` \u2014 NPU\u2194GPU KV cache bridge (sync NPU BO\u2194GPU buffers)\n- `server.zig` \u2014 Unified HTTP server (OpenAI-compatible API)\n- `main.zig` \u2014 CLI entry point\n\n## Build\n\n```bash\ncd engine/fusion && zig build -Doptimize=ReleaseFast\n```\n\n## Status\n\n- \u2705 Unified KV cache scheduler (KvPagePool, H2O eviction, RadixAttention, zero-page)\n- \u2705 FusedEngine interface\n- \u2705 Dispatcher with 8 dispatch policies\n- \u2705 Cross-backend memory (dma-buf + staging fallback)\n- \u2705 NPU\u2194GPU interop (KV cache sync bridge)\n- \u2705 Unified HTTP server (OpenAI-compatible API)\n- \u2b1c Fused prefix tree \u2014 RadixAttention shared across NPU+GPU paths\n- \u2b1c Dynamic policy switching \u2014 Runtime policy change via API\n- \u2b1c Auto-tuning \u2014 Benchmark each operation and choose fastest backend\n\n## Citations\n\n[1] [Dispatch Policies](/references/dispatch_policies.md)\n[2] [Unified KV Cache](/structures/kv_cache.md)", "engines/npu_engine": "# Overview\n\nThe NPU engine is the **production inference engine** for 1bit.systems, running on the AMD NPU via XRT (Xilinx Runtime). C++ v12 achieves **97 tok/s** on Qwen3-0.6B at 10.3 ms/tok decode \u2014 matching and exceeding the AMD FLM runtime on decode through batched dispatch amortization.\n\n## Key Facts\n\n- **Binary size**: 74 KB (73 KB actual) \u2014 zero external dependencies\n- **Auto-detects 5 models** from a single binary\n- **All-models mode**: 28 tok/s (C++ all-5)\n- **FLM fallback**: 94 tok/s, 10.6 ms/tok \u2014 uses AMD's proprietary runtime\n- **INT8 xclbins**: `/home/bcloud/npu-sandbox/npu-infer/build/int8/`\n- **Model path**: `~/.config/flm/models/Qwen3-0.6B-NPU2/model.q4nx`\n- **NPU2 firmware**: Supports 8+ simultaneous hw_contexts (firmware 1.1.2.65)\n\n## Engine Evolution\n\n244 \u2192 10 ms/tok in 4 days (24\u00d7 speedup):\n\n| Version | ms/tok | Strategy |\n|---------|--------|----------|\n| v7 BFP16 | 1930 | Initial BFP16 prototype |\n| i8 swap | 244 | Switched to INT8 quantization |\n| v6 batch-4 | 50 | Batch-4 dispatch amortization |\n| v9 M=16 | 16 | Batch-16 dispatch amortization |\n| v12 M=32 | 10 | Batch-32 \u2014 production. Matches FLM on decode. |\n\n> C++ v12's advantage over FLM is per-request TTFT (fused xclbin eliminates per-layer ioctl). FLM's advantage is single-request decode latency.\n\n## Source Layout\n\n- `engine/npu/src/npu_engine_cb.cpp` \u2014 Main loop (batched prefill + decode)\n- `engine/npu/src/dequant_q4nx.c` \u2014 Q4NX dequantizer\n- `engine/npu/kernel/edge_attention.cc` \u2014 NPU attention (Chess C++)\n- `engine/npu/xclbins/n1_core_i8_v2.py` \u2014 INT8 MLIR generator\n\n## Build\n\n```bash\ng++ -std=c++23 -O3 -o npu_engine engine/npu/src/npu_engine_cb.cpp \\\n  engine/npu/build/dequant_q4nx.o \\\n  -I$XRT/include -L$XRT/lib64 -lxrt_coreutil -luuid -lm -ldl\n```\n\n## Verification\n\n```bash\ncurl -s http://127.0.0.1:9090/v1/chat/completions \\\n  -d '{\"model\":\"qwen3:0.6b\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}'\n```\n\nExpect C++ v12 engine to respond at ~97 tok/s. Falls back to FLM at ~94 tok/s.\n\n## Citations\n\n[1] [Engine bench deep-dive](https://github.com/1bit-systems/1bit/tree/main/engine/npu/BENCHMARKS.md)\n[2] [Audit trail](https://github.com/1bit-systems/1bit/blob/main/docs/journey.md)\n[3] [Performance Benchmarks](/references/performance_benchmarks.md)", "engines/rocm_backend": "# Overview\n\nThe ROCm backend lives inside the `zaya-llama.cpp/` fork as `ggml/src/ggml-rocm/`. It provides custom HIP kernels for 1-bit and ternary inference on AMD Strix Halo (gfx1151).\n\n## Exported Symbols\n\n100 exported C API symbols covering:\n\n| Category | Kernels |\n|----------|---------|\n| Ternary GEMV | Matrix-vector for ternary weights |\n| Bonsai Q1/TQ2 | 1-bit and ternary-quantized Bonsai models |\n| Sherry | Sherry model inference kernels |\n| KV Cache Attention | Prefill, decode, FD, I8, PQ3 |\n| Prefill GEMM | 28.4 TFlops prefill GEMM |\n| Medusa | Medusa tree attention for speculative decoding |\n| Model Loader | Loader for GGUF models |\n| Tokenizer | Tokenizer integration |\n\n## Build\n\nBuilt standalone at `1bit/build-rocm/librocm_cpp.so` or as a ggml backend.\n\n## Toolchain\n\nUses **TheRock 7.12** ROCm toolchain via nightly pip (ROCm 7.14.0a):\n\n```bash\n# ROCm venv at /tmp/rocm-venv/\n# System ROCm at /opt/rocm\n```\n\n## Supported Models\n\n| Model | BPW | Config |\n|-------|-----|--------|\n| Bonsai-1.7B TQ2 | 2.0 | 113 tok/s decode (8.8 ms/tok) |\n| Zaya | Ternary | Hybrid CCA + MoE with EDA router |\n\n## Performance\n\n**Bonsai-1.7B TQ2**: 113 tok/s decode at 8.8 ms/tok \u2014 the fastest 1-bit model on ROCm.\n\n## Citations\n\n[1] [GPU Benchmarks](/references/gpu_benchmarks.md)\n[2] [Zaya Architecture](/structures/zaya_architecture.md)", "engines/unified_daemon": "# Overview\n\nThe unified daemon (`npu-gpu-cpu/`) serves all inference engines through a single HTTP API. A 74 KB binary that auto-detects 5 models and routes requests to the optimal backend.\n\n## Architecture\n\n```\nClient \u2500\u2500\u25b6 HTTP API (:9090)\n              \u2502\n              \u25bc\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u2502   Router    \u2502\n        \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n        \u2502 C++ v12 NPU \u2502\u2500\u2500\u25b6 Production path (97 tok/s)\n        \u2502 FLM proxy   \u2502\u2500\u2500\u25b6 Fallback path (94 tok/s)\n        \u2502 GPU backend \u2502\u2500\u2500\u25b6 Vulkan/ROCm path\n        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n              \u2502\n              \u25bc\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u2502 KV Cache    \u2502\u2500\u2500 Shared across all backends\n        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n## API\n\nOpenAI-compatible chat completions endpoint:\n\n```bash\ncurl -s http://127.0.0.1:9090/v1/chat/completions \\\n  -d '{\n    \"model\": \"qwen3:0.6b\",\n    \"messages\": [{\"role\":\"user\",\"content\":\"Hello\"}],\n    \"max_tokens\": 100\n  }'\n```\n\n## Models Auto-Detected\n\nThe 74 KB binary auto-detects all 5 models from the filesystem without configuration.\n\n## Deployment\n\n- **Packaging**: `packaging/` (deb + snap + tarball + docker + ollama)\n- **CI**: Pre-commit `/verify` check required before engine changes\n- **Release**: `gh release create` + upload deb/snap/tarball + tag vYYYY.MM.DD\n\n## Citations\n\n[1] [NPU Engine](/engines/npu_engine.md)\n[2] [Fused Engine](/engines/fused_engine.md)", "references/dispatch_policies": "# Overview\n\nThe Fused Engine dispatcher (`engine/fusion/dispatcher.zig`) supports 8 dispatch policies, controlled via `--policy <name>`.\n\n## Policy Reference\n\n| Policy | Attention | FFN | QKV | Use Case |\n|--------|-----------|-----|-----|----------|\n| `auto` | GPU | NPU | NPU | **Best throughput** \u2014 GPU flash attention + NPU INT8 GEMM |\n| `npu_only` | NPU | NPU | NPU | NPU-only mode (models without GPU flash attention kernels) |\n| `gpu_only` | GPU | GPU | GPU | GPU-only fallback (when NPU xclbins unavailable) |\n| `attention_on_npu` | NPU | GPU | GPU | NPU edge_attention kernel + GPU DMMV |\n| `ffn_on_npu` | GPU | NPU | GPU | GPU flash attention + NPU INT8 GEMM (FFN-heavy models) |\n| `qkv_on_npu` | GPU | GPU | NPU | QKV projection on NPU, rest on GPU |\n| `layer_by_layer` | Per-layer | Per-layer | Per-layer | Benchmark each layer's operations and choose |\n| `prefill_npu_decode_gpu` | NPU(prefill) | GPU(decode) | NPU(prefill) | Fast prefill on NPU, batch decode on GPU |\n\n## How It Works\n\nAt each layer, the dispatcher examines the operation type (Attention, FFN, QKV projection) and routes it to the appropriate backend based on the active policy.\n\n- **NPU path**: XRT xclbin INT8 GEMM via `engine/npu/`\n- **GPU path**: Vulkan flash attention / DMMV via `engine/gpu/`\n- **KV cache**: Shared across both via the unified scheduler\n\n## Cross-Backend Memory\n\n- **dma-buf** (preferred): Direct NPU BO \u2194 GPU buffer sharing\n- **Staging copy** (fallback): Through host memory\n\n## Citations\n\n[1] [Fused Engine Architecture](/engines/fused_engine.md)\n[2] [Unified KV Cache](/structures/kv_cache.md)", "references/gpu_benchmarks": "# Overview\n\nAll models at \u22641.5625 bpw, measured via Vulkan on Radeon 8060S, 3 repetitions.\n\n## Benchmarks\n\n| Model | BPW | Size | Engine | Decode (tok/s) |\n|-------|-----|------|--------|-----------------|\n| Qwen2 0.5B | 1.06 (IQ1_S) | 296 MB | llama.cpp | **381** |\n| Qwen3.5-0.8B | 1.25 (Q1_0) | 268 MB | llama.cpp | **312** |\n| Hy-MT2 1.8B | 1.3125 (STQ1_0) | 441 MB | ZINC (Sherry) | **267** |\n| gemma-2-2b | 1.06 (IQ1_S) | 788 MB | llama.cpp | **158** |\n| gemma3 4B | 1.06 (IQ1_S) | 1.05 GB | llama.cpp | **122** |\n| Nemo 8B | 1.06 (IQ1_S) | 1.97 GB | llama.cpp | **79** |\n| Qwen3.5-9B | 1.25 (Q1_0) | 1.82 GB | llama.cpp | **70** |\n\n## Notes\n\n- All models quantized to \u22641.5625 bpw (bits per weight)\n- **Radeon 8060S** integrated GPU on AMD Strix Halo APU\n- llama.cpp backend for IQ1_S and Q1_0 formats\n- ZINC (custom Zig engine) for STQ1_0 (Sherry format)\n\n## Full Reference\n\nSee `docs/wiki/performance.md` for the complete live-verified table.\n\n## Citations\n\n[1] [Performance wiki](https://github.com/1bit-systems/1bit/blob/main/docs/wiki/performance.md)", "references/performance_benchmarks": "# Overview\n\nLive-verified benchmark results from the July 6, 2026 refresh. Full source at the [performance wiki](https://github.com/1bit-systems/1bit/blob/main/docs/wiki/performance.md).\n\n## Engine Head-to-Head (Qwen3-0.6B)\n\n| Engine | tok/s | ms/tok | Notes |\n|--------|-------|--------|-------|\n| NPU C++ v12 | **97** | 10.3 | Production \u2014 M=32 batched dispatch |\n| FLM proxy | **94** | 10.6 | Production fallback \u2014 AMD proprietary |\n| C++ all-5 | **28** | 35.7 | All 5 models auto-detected |\n| GPU (ROCm) | **22** | 45.5 | Via zaya-llama.cpp ggml-rocm |\n\n## 1-Bit Model Benchmarks (NPU C++ v12)\n\n| Model | BPW | Size | tok/s |\n|-------|-----|------|-------|\n| Qwen3-0.6B | Q4NX | ~350 MB | 97 |\n| Qwen3-0.6B (all-5) | Mixed | 74 KB binary | 28 |\n\n## Full Benchmark Source\n\nSee the [full performance wiki](https://github.com/1bit-systems/1bit/blob/main/docs/wiki/performance.md) for:\n- Complete 1-bit model tables\n- All engine head-to-head comparisons\n- ROCm custom kernel benchmarks\n- Eagle3 speculative decoding benchmarks\n- H2O KV cache eviction benchmarks\n- Wave32 GPU optimization benchmarks\n\n## Citations\n\n[1] [Performance wiki](https://github.com/1bit-systems/1bit/blob/main/docs/wiki/performance.md)\n[2] [Engine bench deep-dive](https://github.com/1bit-systems/1bit/blob/main/engine/npu/BENCHMARKS.md)\n[3] [GPU 1-Bit Benchmarks](/references/gpu_benchmarks.md)", "structures/kv_cache": "# Overview\n\nThe unified KV cache layer (`engine/gpu/src/scheduler/`) is shared across all three inference paths (NPU, GPU, CPU). It provides a backend-agnostic infrastructure for managing key-value cache memory efficiently.\n\n## Components\n\n### kv_cache.zig \u2014 H2O Eviction\n\nCumulative attention scoring for eviction decisions. Uses a **min-heap** to track the lowest-scoring pages and a **zero-page technique** that remaps evicted pages to a reserved zero-filled page \u2014 naturally gets ~0 attention, requires no shader changes.\n\nThree eviction policies (set via `ZINC_KV_EVICTION_POLICY` env var):\n\n| Policy | Description |\n|--------|-------------|\n| `h2o_attention_score` | Evict pages with lowest cumulative attention scores (default, best quality) |\n| `lru` | Evict least recently used pages |\n| `fifo` | Evict oldest pages first |\n\n### radix_tree.zig \u2014 RadixAttention\n\nPrefix tree for cross-request KV page sharing. When multiple requests share a common prefix (e.g., system prompt), the KV cache for that prefix is computed once and shared. Dramatically reduces TTFT for requests with shared prefixes.\n\n### offload_engine.zig \u2014 CPU Offloading\n\nCold KV pages are evicted to CPU memory. Pages that haven't been accessed recently are moved off the NPU/GPU to free space for active requests. Pages are brought back on demand.\n\n### quant_profile.zig \u2014 Dynamic Quantization\n\nPer-layer dynamic quantization scheme selection from 8 schemes. Each layer can use a different quantization format based on its sensitivity to precision loss.\n\n### request.zig + scheduler.zig \u2014 Lifecycle & Batching\n\nContinuous batching with page allocation. Requests are scheduled based on available KV cache pages, with fairness and priority support.\n\n## Cross-Backend Sharing\n\nThe KV cache is shared across NPU and GPU via:\n\n- **dma-buf** (preferred): Direct memory sharing between NPU BO and GPU buffers\n- **Staging copy** (fallback): Copy through host memory when dma-buf is unavailable\n\n## Citations\n\n[1] [Fused Engine Interop](/engines/fused_engine.md)\n[2] [Original paper: H2O \u2014 Heavy-Hitter Oracle](https://arxiv.org/abs/2306.14048)", "structures/zaya_architecture": "# Overview\n\nZaya is a hybrid architecture combining **CCA-attention** (Cross-Computer Attention) with **Mixture-of-Experts (MoE)** and an **EDA router** (Expert-Dependent Attention routing).\n\n## Architecture\n\n```\nInput\n  \u2502\n  \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502   EDA Router  \u2502  Expert-Dependent Attention routing\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n       \u2502\n       \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  CCA Attend  \u2502\u2500\u2500\u2500\u2500\u25b6\u2502   Expert 1   \u2502\n\u2502  (shared)    \u2502     \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2502   Expert 2   \u2502\n                     \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n                     \u2502   Expert N   \u2502\n                     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n       \u2502\n       \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502   Merged Out \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n## Key Components\n\n### CCA Attention\nCross-Computer Attention enables efficient processing across distributed memory. Each attention head can attend to tokens across sub-batches.\n\n### EDA Router\nExpert-Dependent Attention routing determines which experts should process each token based on attention patterns rather than simple top-k routing.\n\n### MoE Layers\nMultiple expert feed-forward networks, sparsely activated per token. Ternary weights enable extreme compression.\n\n## ROCm Support\n\nCustom ROCm kernels support Zaya inference on AMD Strix Halo (gfx1151):\n- Ternary GEMV for MoE layers\n- CCA attention kernels\n- EDA router kernels\n\n## Citations\n\n[1] [ROCm Backend](/engines/rocm_backend.md)\n[2] [zaya-llama.cpp fork](https://github.com/1bit-systems/zaya-llama.cpp)"}, "types": ["Engine", "Reference", "Structure", "Unknown"]};

  elements: [...BUNDLE.nodes, ...BUNDLE.edges],
  style: [
    { selector: 'node', style: { 'background-color': 'data(color)', 'label': 'data(label)', 'text-valign': 'center', 'text-halign': 'center', 'color': '#e2e8f0', 'font-size': '12px', 'width': 'data(size)', 'height': 'data(size)', 'text-wrap': 'wrap', 'text-max-width': '100' } },
    { selector: 'edge', style: { 'width': 1.5, 'line-color': '#475569', 'target-arrow-color': '#475569', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.8 } },
    { selector: ':selected', style: { 'border-width': 3, 'border-color': '#fbbf24' } }
  ],
  layout: { name: 'cose', nodeRepulsion: () => 8000, idealEdgeLength: () => 120 },
  minZoom: 0.3, maxZoom: 3, wheelSensitivity: 0.3
});

document.getElementById('bundle-name').textContent = BUNDLE_NAME;

const typeSelect = document.getElementById('filter-type');
for (const t of BUNDLE.types || []) {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t;
  typeSelect.appendChild(opt);
}

document.getElementById('layout').addEventListener('change', e => {
  cy.layout({ name: e.target.value, nodeRepulsion: () => 8000, idealEdgeLength: () => 120 }).run();
});

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  cy.nodes().forEach(n => {
    const d = n.data();
    const match = !q || d.label.toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || (d.tags || []).some(t => t.toLowerCase().includes(q));
    n.style({ opacity: match ? 1 : 0.2 });
  });
});

document.getElementById('reset').addEventListener('click', () => {
  cy.fit(50);
  cy.nodes().style({ opacity: 1 });
  document.getElementById('search').value = '';
  document.getElementById('filter-type').value = '';
});

let selectedNode = null;
cy.on('tap', 'node', e => {
  const n = e.target;
  const d = n.data();
  selectedNode = d.id;
  document.getElementById('detail-empty').hidden = true;
  document.getElementById('detail-content').hidden = false;
  document.getElementById('detail-type').textContent = d.type || 'Unknown';
  document.getElementById('detail-type').style.backgroundColor = d.color || '#94a3b8';
  document.getElementById('detail-title').textContent = d.label || d.id;
  document.getElementById('detail-id').textContent = d.id;
  document.getElementById('detail-description').textContent = d.description || '(none)';
  const res = document.getElementById('detail-resource');
  if (d.resource) {
    const a = document.createElement('a');
    a.href = d.resource; a.textContent = d.resource; a.target = '_blank';
    res.innerHTML = ''; res.appendChild(a);
  } else { res.textContent = '(none)'; }
  document.getElementById('detail-tags').textContent = (d.tags || []).join(', ') || '(none)';
  const body = BUNDLE.bodies[d.id] || '';
  const html = marked.parse(body);
  document.getElementById('detail-body').innerHTML = html;
  // Rewire internal links
  document.getElementById('detail-body').querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.endsWith('.md') && !h.startsWith('http')) {
      a.addEventListener('click', e => { e.preventDefault();
        const targetId = h.replace(/\//g, '/').replace(/\.md$/,'').replace(/^\.\//,'');
        const node = cy.getElementById(targetId);
        if (node.length) { cy.animate({ center: { eles: node }, zoom: 2 }); /* tap it */ }
      });
    }
  });
  // Backlinks
  const bl = BUNDLE.edges.filter(e => e.data.target === d.id).map(e => e.data.source);
  const blSection = document.getElementById('detail-backlinks');
  if (bl.length) {
    blSection.hidden = false;
    const list = document.getElementById('backlinks-list');
    list.innerHTML = '';
    for (const src of bl) {
      const srcNode = BUNDLE.nodes.find(n => n.data.id === src);
      const label = srcNode ? srcNode.data.label : src;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#'; a.textContent = label;
      a.addEventListener('click', e => { e.preventDefault();
        const node = cy.getElementById(src);
        if (node.length) { cy.animate({ center: { eles: node }, zoom: 2 }); }
      });
      li.appendChild(a); list.appendChild(li);
    }
  } else { blSection.hidden = true; }
});

cy.on('tap', e => { if (e.target === cy) { selectedNode = null; } });
</script>
</body>
</html>
