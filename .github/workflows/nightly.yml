name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'   # 4AM UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  okf-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install okf-schema
        run: pip install okf-schema
      - name: Regenerate OKF indexes
        run: |
          okf-schema index --path .kb
          okf-schema index --path jarvis/data/knowledge
      - name: Validate both bundles
        run: |
          echo "=== 1bit.systems KB ==="
          okf-schema validate --path .kb
          echo "=== JARVIS KB ==="
          okf-schema validate --path jarvis/data/knowledge
      - name: Commit index updates
        run: |
          git config user.name "Nightly Bot"
          git config user.email "nightly-bot@1bit.systems"
          git add .kb/ jarvis/data/knowledge/
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore: nightly OKF index regeneration [skip ci]"
            git push
          fi

  parse-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate benchmark badges
        run: bash scripts/parse-benchmarks.sh
      - name: Commit badge updates
        run: |
          git config user.name "Nightly Bot"
          git config user.email "nightly-bot@1bit.systems"
          git add site/benchmarks.json site/*-badge.json
          if git diff --cached --quiet; then
            echo "No badge changes"
          else
            git commit -m "chore: nightly benchmark badge refresh [skip ci]"
            git push
          fi

  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NPU engine
        run: |
          gcc -c -O3 -o dequant_q4nx.o engine/npu/src/dequant_q4nx.c 2>/dev/null || true
          g++ -std=c++23 -O3 -o 1bit-npu \
            engine/npu/src/npu_engine_all.cpp \
            dequant_q4nx.o \
            -Iengine/npu -lxrt_coreutil -luuid -lm -ldl 2>/dev/null || \
          echo "::warning::NPU engine build requires XRT (not available in CI)"
      - name: Build fused engine server
        run: |
          # Build the HTTP server stub
          if [ -f packaging/binary/server.cpp ]; then
            g++ -std=c++23 -O3 -o 1bit-server packaging/binary/server.cpp 2>/dev/null || true
          fi
      - name: Verify packaging scripts are valid
        run: |
          for f in packaging/*.sh; do
            bash -n "$f" && echo "  OK: $f" || echo "  FAIL: $f"
          done
      - name: Build tarball
        run: |
          VERSION="nightly-$(date -u +%Y%m%d)"
          PKG="1bit-systems-${VERSION}-linux-amd64"
          mkdir -p "${PKG}/bin" "${PKG}/lib"
          [ -f 1bit-npu ] && cp 1bit-npu "${PKG}/bin/"
          [ -f 1bit-server ] && cp 1bit-server "${PKG}/bin/"
          cp packaging/npu-install.sh "${PKG}/" 2>/dev/null || true
          tar czf "1bit-systems-${VERSION}.tar.gz" "${PKG}/"
          ls -lh "1bit-systems-${VERSION}.tar.gz"
      - name: Upload nightly tarball
        uses: actions/upload-artifact@v4
        with:
          name: nightly-packages
          path: "1bit-systems-*.tar.gz"
          retention-days: 7

  check-docs-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all cross-references
        run: |
          ERR=0
          # Check that all docs/wiki/*.md references in code exist
          for ref in $(grep -roh 'docs/wiki/[a-zA-Z0-9_/-]*\.md' . --include="*.md" 2>/dev/null | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "BROKEN: $ref"
              ERR=$((ERR+1))
            fi
          done
          # Check that all BENCHMARKS.md links resolve
          for ref in $(grep -roh 'engine/[a-zA-Z0-9_/-]*BENCHMARKS\.md' . --include="*.md" 2>/dev/null | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "BROKEN: $ref"
              ERR=$((ERR+1))
            fi
          done
          if [ "$ERR" -gt 0 ]; then
            echo "::warning::$ERR broken cross-reference(s) found"
          else
            echo "All cross-references healthy"
          fi
