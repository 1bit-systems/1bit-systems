name: Validate Benchmark Table

on:
  pull_request:
    paths:
      - "site/benchmarks.json"
      - "README.md"
      - "scripts/generate_benchmark_table.py"
  workflow_dispatch:

jobs:
  check-benchmark-table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check README table matches benchmarks.json
        run: |
          if [ -f scripts/generate_benchmark_table.py ]; then
            python3 scripts/generate_benchmark_table.py --check
          else
            echo "::notice::scripts/generate_benchmark_table.py not present (pure-C++ repo, generator retired) — skipping table check."
          fi

      - name: Validate benchmark status transitions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Get the base revision to compare against
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Check if benchmarks.json changed
          if ! git diff --name-only "$BASE" "$HEAD" | grep -q "site/benchmarks.json"; then
            echo "benchmarks.json not modified — skipping status validation."
            exit 0
          fi

          echo "benchmarks.json was modified. Checking status transitions..."

          # Fetch the base revision's benchmarks.json so old/new can actually
          # be diffed (a prior version of this check tried to read the old
          # file from stdin inside a `python3 <<'PY'` heredoc -- but the
          # heredoc itself is what's fed to python's stdin, so by the time
          # the script ran, stdin was already at EOF and `old` was always
          # `{}`. That made every transition check silently inert. See #80.
          git fetch origin "$BASE" 2>/dev/null || true
          if git show "$BASE:site/benchmarks.json" > /tmp/old_benchmarks.json 2>/dev/null; then
            python3 -c "
          import json, sys

          with open('/tmp/old_benchmarks.json') as f:
              old = json.load(f)
          with open('site/benchmarks.json') as f:
              new = json.load(f)

          old_engines = old.get('engines', {})
          new_engines = new.get('engines', {})

          allowed_transitions = {
              ('broken', 'broken'): True,
              ('raw', 'raw'): True,
              ('raw', 'broken'): True,
              ('measured', 'measured'): True,
              ('validated', 'validated'): True,
              ('validated', 'measured'): True,
              ('validated', 'broken'): True,
              ('validated', 'raw'): True,
              ('measured', 'reported'): True,
          }

          errors = []
          for key, entry in new_engines.items():
              old_entry = old_engines.get(key, {})
              old_status = old_entry.get('status', '')
              new_status = entry.get('status', '')

              if old_status and old_status != new_status:
                  transition = (old_status, new_status)
                  if transition not in allowed_transitions:
                      errors.append(
                          f'{key}: {old_status} -> {new_status} is not an allowed transition. '
                          f'Upgrades (raw->validated, measured->validated) require '
                          f'on-device validation evidence in the PR description.'
                      )

          if errors:
              print('XX Invalid benchmark status transitions:', file=sys.stderr)
              for e in errors:
                  print(f'  - {e}', file=sys.stderr)
              print(file=sys.stderr)
              print('Allowed transitions: raw->broken, validated<->any, measured->reported', file=sys.stderr)
              print('Upgrades (raw->validated, measured->validated) need hardware evidence.', file=sys.stderr)
              sys.exit(1)
          print('OK: all benchmark status transitions are valid.')
          "
          else
            echo "Could not fetch base revision -- skipping status-transition check."
          fi
