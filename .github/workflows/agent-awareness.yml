# agent-awareness.yml — Signal local agents about remote pushes to main
#
# When a push comes in from GitHub (PR merge, direct push, etc.),
# this workflow creates a dispatch event that the local machine can
# pick up to update the awareness file.
#
# For this to work locally, set up a webhook receiver or use
# `gh run watch` to poll for workflow runs.

name: Agent Awareness

on:
  push:
    branches: [main]

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect change info
        id: changes
        run: |
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          git log --format='- %h %s (%an)' "${{ github.event.before }}..${{ github.event.after }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only "${{ github.event.before }}..${{ github.event.after }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Log awareness event
        run: |
          echo "::notice::📢 Codebase updated by ${{ github.actor }}"
          echo "::notice::Commits:"
          echo "${{ steps.changes.outputs.commits }}"
