name: Site Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily at 6am UTC

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Cloudflare Pages analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$CLOUDFLARE_API_TOKEN"
          PROJECT="1bit-systems"
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT"

          echo "=== Project Info ==="
          curl -s -H "Authorization: Bearer $TOKEN" "$API" | \
            jq '{ name: .result.name, subdomain: .result.subdomain, domains: .result.domains, created: .result.created_on }'

          echo ""
          echo "=== Analytics (last 30 days) ==="
          curl -s -H "Authorization: Bearer $TOKEN" "$API/analytics" | \
            jq '{
              visitors_30d: (.result.visitors.unique_visitors.sum // 0),
              page_views_30d: (.result.page_views.sum // 0),
              total_requests_30d: (.result.requests.sum // 0),
              bandwidth_30d: (.result.bandwidth.sum // 0)
            }'

          echo ""
          echo "=== Daily visitors (last 7 days) ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/analytics" | \
            jq '.result.visitors.unique_visitors.series[]? | { date: .[0], visitors: .[1] }' 2>/dev/null || \
            echo "(daily breakdown not available on this plan)"

          echo ""
          echo "=== Deployments (last 5) ==="
          curl -s -H "Authorization: Bearer $TOKEN" "$API/deployments?per_page=5" | \
            jq '[.result[]? | { environment, created_on, deployment_trigger: .deployment_trigger.type, latest_stage: ([.stages[]? | select(.ended_on == null) | .name] | first // "complete") }]'
