name: Site Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Cloudflare Pages analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$CLOUDFLARE_API_TOKEN"
          PROJECT="1bit-systems"

          echo "=== Project Info ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT" | \
            jq '{ name: .result.name, subdomain: .result.subdomain, domains: .result.domains }'

          echo ""
          echo "=== Deployments (last 5) ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/deployments?per_page=5" | \
            jq '[.result[]? | { environment, created_on, deploy_url: .url, latest_stage: ([.stages[]? | select(.ended_on == null) | .name] | first // "complete") }]'

          echo ""
          echo "=== Analytics via GraphQL (last 7 days) ==="
          TODAY=$(date -u +%Y-%m-%d)
          WEEK_AGO=$(date -u -d "7 days ago" +%Y-%m-%d)
          QUERY='{"query":"{\n  viewer {\n    accounts(filter: {accountTag: \"'$ACCOUNT_ID'\"}) {\n      pagesAdaptiveGroups(limit: 100, filter: {date_gt: \"'$WEEK_AGO'\", projectName: \"'$PROJECT'\"}, orderBy: [date_DESC]) {\n        dimensions { date projectName }\n        uniq {\n          uniques\n        }\n        count\n        sum {\n          requests\n          bytes\n        }\n      }\n    }\n  }\n}","variables":{}}'
          curl -s -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            "https://api.cloudflare.com/client/v4/graphql" | \
            jq '{
              daily: [.data.viewer.accounts[0].pagesAdaptiveGroups[]? | {
                date: .dimensions.date,
                visitors: .uniq.uniques,
                requests: .sum.requests,
                bandwidth_bytes: .sum.bytes
              }],
              total_visitors: ([.data.viewer.accounts[0].pagesAdaptiveGroups[]?.uniq.uniques] | add // 0),
              total_requests: ([.data.viewer.accounts[0].pagesAdaptiveGroups[]?.sum.requests] | add // 0)
            }' 2>/dev/null || echo "(GraphQL analytics not available — check Cloudflare dashboard)"
