name: Benchmark Badge

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 8AM UTC
  push:
    paths:
      - 'docs/wiki/performance.md'
      - 'engine/npu/BENCHMARKS.md'
      - 'scripts/parse-benchmarks.sh'
  workflow_dispatch:

jobs:
  parse-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse benchmarks
        run: bash scripts/parse-benchmarks.sh

      - name: Verify JSON validity
        run: |
          for f in site/benchmarks.json site/bench-badge.json site/tok-badge.json \
                   site/flm-badge.json site/gpu-badge.json site/rocm-badge.json \
                   site/tern-badge.json site/tflops-badge.json; do
            echo -n "$f: "
            python3 -m json.tool "$f" > /dev/null && echo "valid" || { echo "INVALID"; exit 1; }
          done

      - name: Commit updated badges
        run: |
          git config user.name "Benchmark Bot"
          git config user.email "benchmark-bot@1bit.systems"
          git add site/benchmarks.json site/*-badge.json
          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "No changes — badges already current"
          else
            git commit -m "chore: update benchmark badges [skip ci]"
            git push
          fi
