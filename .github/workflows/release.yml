name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:    # manual runs (branch builds) — Create Release is guarded to tag-only so no junk release is published

permissions: {}

jobs:
  server:
    name: Build release (C++ HIP kernels + server + CLI) — TheRock 7.15.0a
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:7.2.4-complete
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install build tools + TheRock nightly ROCm
        run: |
          apt-get update -qq
          apt-get install -y -qq git cmake ninja-build build-essential \
            libvulkan-dev uuid-dev python3-pip python3-venv

          # Install TheRock nightly ROCm SDK (AMD's C++ toolchain for Strix Halo)
          # This replaces the system ROCm at /opt/rocm with TheRock 7.15.0a
          # at /opt/rocm-therock. CMakeLists.txt auto-detects /opt/rocm-therock
          # before falling back to system ROCm.
          python3 -m venv /opt/rocm-therock
          /opt/rocm-therock/bin/pip install \
            "rocm[libraries,devel,device-gfx1151]" \
            --index-url https://rocm.nightlies.amd.com/whl-multi-arch/
          /opt/rocm-therock/bin/rocm-sdk init

      - name: Build all C++ targets (TheRock 7.15.0a HIP kernels + servers + CLI)
        run: |
          # TheRock installs into a Python venv at /opt/rocm-therock.
          # Find the Python site-packages directory (version-dependent) and
          # set all the paths CMakeLists.txt needs to discover TheRock.
          THEROCK_ROOT="/opt/rocm-therock"
          PYTHON_SITE="$(dirname "$(find "$THEROCK_ROOT/lib" -name '_rocm_sdk_devel' -type d 2>/dev/null | head -1)")"
          echo "TheRock site-packages: $PYTHON_SITE"

          export ROCM_PATH="$PYTHON_SITE/_rocm_sdk_devel"
          export HIP_PATH="$ROCM_PATH"
          export ROCM_CORE_PATH="$PYTHON_SITE/_rocm_sdk_core"
          export ROCM_LIB_PATH="$PYTHON_SITE/_rocm_sdk_libraries"
          export ROCM_DEVICE_LIBS_PATH="$PYTHON_SITE/_rocm_sdk_device_gfx1151"
          export LLVM_PATH="$ROCM_PATH/lib/llvm"
          export PATH="$ROCM_PATH/bin:$ROCM_CORE_PATH/bin:$THEROCK_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$ROCM_PATH/lib:$ROCM_CORE_PATH/lib:$ROCM_LIB_PATH/lib:$LD_LIBRARY_PATH"
          export HIP_DEVICE_LIB_PATH="$ROCM_CORE_PATH/lib/llvm/amdgcn/bitcode"
          export CFLAGS="-D__HIP_PLATFORM_AMD__ -I$ROCM_PATH/include"
          export CXXFLAGS="-D__HIP_PLATFORM_AMD__ -I$ROCM_PATH/include"
          export CPATH="$ROCM_PATH/include:$CPATH"

          echo "ROCM_PATH=$ROCM_PATH"
          echo "amdclang++: $(which amdclang++)"
          echo "hipcc: $(which hipcc)"
          echo "HIP version: $($ROCM_PATH/bin/hipconfig --version 2>/dev/null || echo 'N/A')"

          cmake -B build -G Ninja \
            -DCMAKE_HIP_ARCHITECTURES=gfx1151 \
            -DCMAKE_PREFIX_PATH="$ROCM_PATH" \
            -DCMAKE_CXX_FLAGS="-I$ROCM_PATH/include" \
            -DCMAKE_HIP_FLAGS="--rocm-path=$ROCM_PATH"
          # Build the core library, inference servers, and all new C++ tools
          ninja -C build \
            rocm_cpp \
            zaya_server \
            onebitd \
            onebit \
            onebit_bin \
            unified_router \
            unified_server \
            zaya_agent \
            bitnet_tui

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib
          # C++ CLI agent (replaces Rust onebit)
          cp build/1bit dist/bin/
          cp build/onebit dist/bin/
          # C++ daemon (spawns inference backend as subprocess)
          cp build/onebitd dist/bin/
          # C++ content-aware routing proxy (replaces unified-router.py)
          cp build/unified_router dist/bin/
          # HIP/C++ inference engine + OpenAI-compatible server
          cp build/zaya_server dist/bin/
          cp build/zaya_agent dist/bin/ 2>/dev/null || true
          cp build/unified_server dist/bin/ 2>/dev/null || true
          # TUI frontend
          cp build/bitnet_tui dist/bin/ 2>/dev/null || true
          # Shared HIP kernel library
          cp build/librocm_cpp.so dist/lib/
          # Docs + install + license
          cp install.sh dist/
          cp README.md dist/
          cp LICENSE dist/
          cp LICENSE-SHERRY.md dist/
          cp site/assets/logo.png dist/
          # A loader script so binaries find librocm_cpp.so
          # next to the tarball without the user hand-setting LD_LIBRARY_PATH.
          cat > dist/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$HERE/bin:$PATH"
          exec "$HERE/bin/1bit" "$@"
          EOF
          chmod +x dist/run.sh
          tar czf 1bit-linux-x86_64.tar.gz -C dist .

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')   # only on real tag pushes; skip manual workflow_dispatch runs
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: 1bit-linux-x86_64.tar.gz
          generate_release_notes: true
          prerelease: false
          body: |
            ## 1bit — Monorepo Release (Pure C++)

            End-to-end C++ inference stack: no Rust, no Python, no Node.js.
            Single CMake build produces all binaries.

            ### Includes
            - `bin/1bit` — C++ NPU-native coding agent CLI (chat, up, down, status, build, config, serve)
            - `bin/onebitd` — C++ inference daemon (spawns zaya_server, proxies HTTP)
            - `bin/zaya_server` — C++ HIP inference engine + OpenAI-compatible server
            - `bin/unified_router` — C++ NPU+GPU content-aware routing proxy
            - `bin/bitnet_tui` — C++ FTXUI terminal chat UI
            - `lib/librocm_cpp.so` — ternary GEMV/GEMM HIP kernels
            - `run.sh` — launcher (sets LD_LIBRARY_PATH + PATH for you)
            - install script, docs, license

            ### Requires
            - AMD Strix Halo (gfx1151)
            - ROCm 7.15.0a runtime (libhsa-runtime64) — TheRock nightly C++ SDK
            - A model file (.h1b, .q4nx, .gguf)

            ### Quick Start
            ```bash
            tar xzf 1bit-linux-x86_64.tar.gz
            export HSA_OVERRIDE_GFX_VERSION=11.5.1
            export HSA_ENABLE_SDMA=0
            ./run.sh chat
            ```
            Then point any OpenAI client at `http://127.0.0.1:13305/v1`.
