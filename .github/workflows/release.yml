name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  server:
    name: Build release (Rust server + HIP kernels)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install build deps + ROCm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          # Use noble (Ubuntu 24.04) repo — jammy (22.04) repos may have
          # missing or incompatible packages on the ubuntu-24.04 runner.
          cat <<'ROCM_APT' | sudo tee /etc/apt/sources.list.d/rocm.list
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2 noble main
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/graphics/7.2/ubuntu noble main
          ROCM_APT
          sudo apt-get update -qq
          sudo apt-get install -y -qq rocm-dev hip-dev composablekernel-dev

      # ── Kernel engine (HIP/C++): librocm_cpp.so + bitnet_decode ──
      # This is the actual inference engine. The Rust server below is a proxy
      # that spawns `bitnet_decode --server`, so the release must ship both.
      - name: Build HIP kernels + decode server
        run: |
          cmake -B build -G Ninja -DCMAKE_HIP_ARCHITECTURES=gfx1151
          ninja -C build rocm_cpp bitnet_decode bench_prefill_variants

      # ── Rust proxy (OpenAI-compatible HTTP frontend) ──
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build + test Rust server
        working-directory: rust
        run: |
          cargo build --release
          cargo test --release

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib
          # Rust HTTP frontend (spawns the decode server as a subprocess)
          cp rust/target/release/onebit dist/bin/
          # HIP/C++ inference engine + OpenAI-compatible decode server
          cp build/bitnet_decode dist/bin/
          cp build/librocm_cpp.so dist/lib/
          cp build/bench_prefill_variants dist/bin/ || true
          # Docs + install + license
          cp install.sh dist/
          cp README.md dist/
          cp LICENSE dist/
          cp LICENSE-SHERRY.md dist/
          cp site/assets/logo.png dist/
          # A loader script so `onebit` finds librocm_cpp.so + bitnet_decode
          # next to the tarball without the user hand-setting LD_LIBRARY_PATH.
          cat > dist/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$HERE/bin:$PATH"
          # onebit spawns bitnet_decode --server internally as a subprocess.
          # No need to pass --server here; all CLI args are forwarded.
          exec "$HERE/bin/onebit" "$@"
          EOF
          chmod +x dist/run.sh
          tar czf 1bit-linux-x86_64.tar.gz -C dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: 1bit-linux-x86_64.tar.gz
          generate_release_notes: true
          prerelease: false
          body: |
            ## 1bit — Monorepo Release

            Unified release: HIP/C++ kernels (`librocm_cpp.so` + `bitnet_decode`)
            plus the Rust OpenAI-compatible HTTP frontend (`onebit`).

            ### Includes
            - `bin/onebit` — Rust HTTP frontend (spawns the decode server)
            - `bin/bitnet_decode` — HIP/C++ inference engine + OpenAI server
            - `lib/librocm_cpp.so` — ternary GEMV/GEMM kernels
            - `run.sh` — launcher (sets LD_LIBRARY_PATH + PATH for you)
            - install script, docs, license

            ### Requires
            - AMD Strix Halo (gfx1151)
            - ROCm 7.2+ runtime (libhsa-runtime64) on the target machine
            - A `.h1b` model file

            ### Quick Start
            ```bash
            tar xzf 1bit-linux-x86_64.tar.gz
            export HSA_OVERRIDE_GFX_VERSION=11.5.1
            export HSA_ENABLE_SDMA=0
            ./run.sh --model model.h1b --port 13305 --tune-prefill --fp16-weights
            ```
            Then point any OpenAI client at `http://127.0.0.1:13305/v1`.
