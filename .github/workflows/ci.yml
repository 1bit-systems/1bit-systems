name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (cmake configure + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps + ROCm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential python3
          # AMD ROCm 7.2 provides the hip + composable_kernel CMake packages
          # this project requires. Pinned to the 7.2.4 apt repo for Strix Halo
          # (gfx1151) parity with the documented build and the verified ROCm
          # version on our hardware. Steps below degrade gracefully if the
          # ROCm packages can't be installed on the runner.
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key 2>/dev/null | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg 2>/dev/null || true
          # Use noble (Ubuntu 24.04) repo — jammy (22.04) repos may have
          # missing or incompatible packages on the ubuntu-24.04 Runner.
          # Guard ROCm repo behind successful key import to avoid runner
          # network failures (repo.radeon.com often unreachable from GH runners).
          if [ -f /etc/apt/keyrings/rocm.gpg ]; then
            printf '%s\n' \
              'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.4 noble main' \
              'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/graphics/7.2.4/ubuntu noble main' \
              | sudo tee /etc/apt/sources.list.d/rocm.list
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq rocm-dev hip-dev composablekernel-dev || true
          else
            echo "ROCm key not available — skipping ROCm install on this runner."
          fi
      - name: Verify CMakeLists references resolve
        run: |
          # Guard against the missing-file class of build break: every
          # add_executable/add_library source path and every add_subdirectory
          # must point at a file/dir that actually exists. Runs even if ROCm
          # failed to install, so a dropped tests/ or ck-prefill/ can never
          # silently re-break the configure step.
          set -e
          python3 -<<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          missing = []
          txt = root.joinpath('CMakeLists.txt').read_text()
          for m in re.findall(r'add_subdirectory\(\s*([^\s\)\s]+)', txt):
              if not (root / m / 'CMakeLists.txt').exists():
                  missing.append(f'add_subdirectory({m}) -> missing CMakeLists.txt')
          for m in re.findall(r'(?:add_executable|add_library)\((.*?)\)', txt, re.S):
              for tok in re.findall(r'([A-Za-z0-9_/+.-]+\.(?:cpp|cc|hip|mm|rc))', m):
                  if not (root / tok).exists():
                      missing.append(f'source file missing: {tok}')
          if missing:
              print('CMakeLists references unresolved files/dirs:')
              for x in missing: print(' -', x)
              sys.exit(1)
          print('All CMakeLists source/subdirectory references resolve.')
          PY
      - name: CMake configure + build (reference checks only when no ROCm)
        run: |
          if [ -d /opt/rocm ] && [ -f /opt/rocm/lib/cmake/hip/hip-config.cmake ]; then
            echo "ROCm detected — full cmake configure + build."
            cmake -B build -G Ninja -DCMAKE_HIP_ARCHITECTURES=gfx1151
            # Build the server AND every test_* target so a dropped source or a
            # compile break fails CI (issue #236). Previously only the wiring
            # skeleton (test_medusa_skeleton) was built, so a broken engine
            # could ship behind a green badge.
            ninja -C build zaya_server \
              test_medusa_skeleton test_standalone_nock test_prim_and_attn \
              test_ternary_gemm_smallm test_sherry_gemv test_bonsai_gemv \
              test_zaya_moe_gemv test_cca_attn test_wmma_i8_gemv \
              test_bonsai_e2e test_sherry_e2e test_block_scaled_ternary
          else
            echo "ROCm not available on this runner — reference checks only."
            if [ -f tests/test_medusa_skeleton.cpp ]; then
              echo "test_medusa_skeleton.cpp exists — monorepo wiring OK."
            else
              echo "Missing test_medusa_skeleton.cpp — build wiring broken."
              exit 1
            fi
          fi
      - name: Run headless tests (ctest -L host)
        # Only 'thost'-labeled tests run without a physical GPU or model
        # file (issue #233). gpu_required / model_required tests are left for
        # the Strix Halo self-hosted runner; running them here would always
        # fail (no device) and teach us nothing.
        # Guarded by existence of build/ dir so we don't fail on ROCm-less runners.
        run: |
          if [ -d build ]; then
            ctest --test-dir build -L host --output-on-failure
          else
            echo "No build/ directory (ROCm unavailable on this runner) - skipping host ctest."
          fi
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error

  lint:
    name: Lint (clang-format, ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check (informational)
        run: |
          sudo apt-get install -y -qq clang-format
          find . -name '*.cpp' -o -name '*.h' -o -name '*.hip' -o -name '*.hpp' | \
            grep -v build/ | grep -v _deps/ | grep -v '.git/' | \
            xargs clang-format --dry-run --Werror 2>&1 | head -20 || true
      - name: Python lint (ruff)
        run: |
          pip install -q ruff
          # ruff exits 1 on ANY finding (style included), not just syntax errors —
          # `|| true` here is deliberate and scoped to just this line, so the step's
          # gating decision is made explicitly below by grep, not by ruff's own
          # exit code or a blanket swallow of the whole step.
          ruff check --select=E,F,W --ignore=E501 tools/ scripts/ --output-format=concise > /tmp/ruff.log 2>&1 || true
          cat /tmp/ruff.log
          if grep -q 'E999' /tmp/ruff.log; then
            echo "::error::Python SyntaxError(s) found (E999) — see ruff output above"
            exit 1
          fi

  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: All manifests match root VERSION
        run: bash scripts/sync-version.sh --check
      - name: Q4NX quant round-trip (issue #153 layout guard)
        run: |
          python3 -m pip install --quiet numpy
          python3 tools/q4nx/test_q4nx_roundtrip.py

  rust:
    name: Rust proxy (build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # If rust/rust-toolchain.tom exists it pins the MSRV and this action
      # honors it automatically; otherwise falls back to stable. (#161)
      - uses: dtolnay/rust-toolchain@stable
      # Cache registry + target dir so we don't rebuild every dependency from
      # scratch on each run (#161).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --release 2>&1 | tail -5
      - name: Test
        working-directory: rust
        run: cargo test --release 2>&1 | tail -10

  ts:
    name: TypeScript CLI (type-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # npm ci / tsc are allowed to fail without failing CI, but the masking
      # is now explicit (continue-on-error) instead of `|| echo '... continuing'`,
      # which previously hid real errors behind a green step (issue #236)).
      - name: Install deps
        run: npm ci
        continue-on-error: true
      - name: Type-check
        if: hashFiles('tsconfig.json') != ''
        run: nxpt tsc --noEmit
        continue-on-error: true

  fusion:
    name: Fused engine (build + smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build fused engine
        working-directory: engine/fusion
        run: zig build -Doptimize=ReleaseSafe 2>&1 | tail -5
      - name: Smoke test (--help)
        # Explicit non-blocking instead of `|| true` so the masking is visible
        # in the run summary (issue #236).
        working-directory: engine/fusion
        run: ./zig-out/bin/fused-engine --help
        continue-on-error: true
