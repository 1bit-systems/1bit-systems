name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  okf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install okf-schema
        run: pip install okf-schema
      - name: Validate 1bit.systems knowledge base
        run: |
          okf-schema validate --path .kb || echo "::warning::OKF validate .kb"
      - name: Validate JARVIS knowledge base
        run: |
          okf-schema validate --path jarvis/data/knowledge || echo "::warning::OKF validate jarvis/kb"
      - name: Validate benchmark badges are parseable
        run: |
          python3 -m json.tool site/benchmarks.json > /dev/null
          for f in site/*-badge.json; do
            python3 -m json.tool "$f" > /dev/null
          done

  benchmark-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify benchmarks.json matches performance.md
        run: bash scripts/parse-benchmarks.sh --check

  numbers-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate numbers.json schema
        run: python3 -m json.tool site/numbers.json > /dev/null
      - name: Check numbers.json keys match site/index.html data-num bindings
        run: |
          grep -oP '(?<=data-num=")[^"]+' site/index.html | sort > /tmp/nums_html.txt
          python3 -c "
import json, sys
n = json.load(open('site/numbers.json'))
def flatten(obj, prefix=''):
    keys = []
    for k,v in obj.items():
        p = f'{prefix}.{k}' if prefix else k
        if isinstance(v, dict):
            keys.extend(flatten(v, p))
        else:
            keys.append(p)
    return keys
expected = set(flatten(n))
actual = set(open('/tmp/nums_html.txt').read().strip().split())
missing = expected - actual
extra = actual - expected
if missing:
    print(f'::warning::numbers.json keys not bound in index.html: {missing}')
if extra:
    print(f'::warning::index.html references keys not in numbers.json: {extra}')
" 2>&1
