name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  okf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install okf-schema
        run: pip install okf-schema
      - name: Validate 1bit.systems knowledge base
        run: |
          okf-schema validate --path .kb || echo "::warning::OKF validate .kb"
      - name: Validate JARVIS knowledge base
        run: |
          okf-schema validate --path jarvis/data/knowledge || echo "::warning::OKF validate jarvis/kb"
      - name: Validate benchmark badges are parseable
        run: |
          python3 -m json.tool site/benchmarks.json > /dev/null
          for f in site/*-badge.json; do
            python3 -m json.tool "$f" > /dev/null
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ 2>/dev/null || echo "::warning::ruff check skipped (no src/)"

  # NOTE: this job used to be "build", and its only step checked that a
  # committed engine/npu/build/npu_engine binary stayed under 75KB.
  # engine/npu/ was retired in commit cd232a091 (superseded by the
  # spec-decode/ stack), so that binary/check no longer exists — the job had
  # no other purpose, so it was removed entirely rather than left as dead
  # logic.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest
      - run: |
          # JARVIS knowledge engine unit tests
          cd jarvis && python3 -m pytest server/ -v --tb=short 2>/dev/null || \
          echo "::warning::JARVIS tests skipped (no pytest in server/)"
