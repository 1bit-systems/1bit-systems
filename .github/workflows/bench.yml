# DISABLED: this workflow's entire purpose was building and benchmarking the
# standalone engine/npu/ runtime, which was retired in commit cd232a091
# (superseded by the spec-decode/ stack; logic carried forward into
# spec-decode/engine/npu_target_model.h). There is nothing left here to build.
# Left in place (rather than deleted) so the self-hosted benchmark harness is
# easy to resurrect/retarget if a spec-decode NPU benchmark job is wanted later.
name: NPU Benchmark

on:
  workflow_dispatch:
    inputs:
      prefill_tokens:
        description: 'Prefill tokens (M)'
        required: false
        default: '9'
      decode_tokens:
        description: 'Decode tokens to generate'
        required: false
        default: '4'

jobs:
  benchmark:
    runs-on: self-hosted
    if: false  # disabled — engine/npu/ no longer exists, see comment at top of file
    steps:
      - uses: actions/checkout@v4

      - name: Disabled
        run: |
          echo "This job is disabled: engine/npu/ was removed in cd232a091."
          exit 1
