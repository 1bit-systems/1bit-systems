name: Feature Request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Tell me what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - NPU Engine (C++)
        - GPU Engine (Zig)
        - HTTP API / Server
        - Packaging / Install
        - Documentation
        - CI/CD
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?

  - type: input
    id: model
    attributes:
      label: Model (if related)
      description: Which model architecture is this for?
      placeholder: e.g. Qwen3-0.6B, Llama-3.1-8B, BitNet b1.58
