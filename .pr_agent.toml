[pr_agent]
model = "deepseek/deepseek-chat"
model_turbo = "deepseek/deepseek-chat"
fallback_models = []
verbosity_level = 2
publish_output = true
publish_output_progress = false

[pr_agent.pr_reviewer]
require_score_review = true
require_tests_review = true
num_ais = 3
extra_instructions = "Focus on INT8 quantization correctness, NPU context lifecycle bugs, BFP16 precision issues, and C++ memory safety. Reviewer: think like an NPU hardware engineer reviewing inference engine code."
inline_code_comments = true
automatic_review = false
persistent_comment = false

[pr_agent.pr_description]
publish_labels = true
extra_instructions = "Use conventional commits. Include performance impact (ms/tok delta). Tag NPU-specific changes with [npu]."
enable_help_text = false

[pr_agent.pr_code_suggestions]
num_code_suggestions = 4
extra_instructions = "Prefer suggestions that reduce context-swapping overhead, eliminate heap allocations in decode loop, or improve INT8 quantization accuracy."

[pr_agent.pr_code_suggestions_reflect]
extra_instructions = "Reflect on whether suggested code would actually improve tok/s or token quality on real NPU hardware. Discard suggestions that are purely stylistic."

[pr_agent.pr_update_changelog]
push_changelog_changes = true

[pr_agent.pr_help_message]
enable_help_text = false

[config]
model = "deepseek/deepseek-chat"
fallback_models = []
ignore_pr_labels = []
# deepseek/deepseek-chat isn't registered in pr-agent's internal MAX_TOKENS
# table, so every review/description/suggestion call was throwing
# "Ensure deepseek/deepseek-chat is defined in MAX_TOKENS ... or set a
# positive value for it in config.custom_model_max_tokens" and failing
# silently on every PR. 64000 matches DeepSeek-V3's published context window.
custom_model_max_tokens = 64000
