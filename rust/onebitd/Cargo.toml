[package]
name = "onebitd"
version = "0.1.0"
edition = "2024"
description = "OpenAI-compatible HTTP frontend for 1-bit inference on AMD Strix Halo — Rust proxy in front of the HIP/C++ bitnet_decode engine"
license = "MIT"
repository = "https://github.com/bong-water-water-bong/1bit"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
hyper = { version = "1", default-features = false, features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# The Rust server (`onebit`) is a pure-HTTP proxy: it spawns the C++/HIP
# `bitnet_decode --server` binary as a subprocess and reverse-proxies
# OpenAI-compatible requests to it. It performs NO inference itself and
# links against no HIP/FFI — all kernel work lives in librocm_cpp.so via
# the bitnet_decode child process. Hence no build script and no
# [build-dependencies].
