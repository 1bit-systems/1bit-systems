[package]
name = "onebit-cli"
version = "0.1.0"
edition = "2024"
description = "1bit — terminal coding agent for the 1bit.systems NPU+GPU+CPU inference stack"
license = "MIT"
repository = "https://github.com/bong-water-water-bong/1bit"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
rustyline = "15"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

# Session store (SQLite)
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# App server (HTTP/SSE API)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"

# Secrets
sha2 = "0.10"
base64 = "0.22"

[[bin]]
name = "1bit"
path = "src/main.rs"
