[package]
name = "onebit-tui"
version = "0.1.0"
edition = "2024"
description = "1bit TUI — terminal UI for the 1bit.systems NPU inference stack"
license = "MIT"
repository = "https://github.com/bong-water-water-bong/1bit"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "1bit-tui"
path = "src/main.rs"
