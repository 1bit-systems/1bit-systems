name: 1bit-systems
version: '2026.07.20'
summary: Model-agnostic NPU+GPU+CPU inference engine for AMD Strix Halo
description: |
  1bit.systems is a pure native inference stack for the AMD Ryzen AI Max+ 395.
  Model-agnostic engine (GGUF/ONNX/1BP auto-detect) across NPU, GPU, and CPU
  backends. Zero Python at runtime. Zero pip. Zero Docker. Just g++ and run.

grade: stable
confinement: strict
base: core24

apps:
  npu:
    command: bin/1bit-npu
    plugs: [xrt, hardware-observe]
  server:
    command: bin/1bit-server
    daemon: simple
    plugs: [network-bind, xrt, hardware-observe]

parts:
  1bit-systems:
    plugin: make
    source: https://github.com/bong-water-water-bong/1bit-systems.git
    source-tag: v2026.07.20
    build-packages: [g++, libxrt-dev]
    stage-packages: [libxrt2, libxrt-npu2]
    override-build: |
      mkdir -p engine/npu/build
      gcc -c -std=c11 -O3 -o engine/npu/build/dequant_q4nx.o engine/npu/src/dequant_q4nx.c
      # engine/npu/src/npu_engine_all.cpp was removed in the orphaned-variant
      # cleanup (PR #312); npu_engine_universal.cpp is the current engine
      # source (see README.md's Backends section and
      # .github/workflows/bench.yml, which builds this exact target on real
      # Strix Halo hardware).
      g++ -std=c++23 -O3 -march=native -fopenmp -ffast-math -o $SNAPCRAFT_PART_INSTALL/bin/1bit-npu \
        engine/npu/src/npu_engine_universal.cpp engine/npu/build/dequant_q4nx.o \
        npu-infer/src/flm_bridge.cpp \
        -Iengine/npu/include -Inpu-infer/include -Iinclude -Iengine/npu -I. \
        -lxrt_coreutil -luuid -lm -ldl -lpthread -laiebu
      g++ -std=c++23 -O3 -o $SNAPCRAFT_PART_INSTALL/bin/1bit-server \
        packaging/binary/server.cpp
