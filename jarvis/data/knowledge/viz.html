tool_reference", "target": "capabilities/tool_calling"}}, {"data": {"id": "references/tool_reference__references/api_reference", "source": "references/tool_reference", "target": "references/api_reference"}}], "bodies": {"architecture/data_flow": "# Overview\n\nHow data flows through the JARVIS stack for each capability.\n\n## Chat Flow\n\n```\nUser Message \u2500\u2500\u25b6 WebSocket / HTTP POST\n                      \u2502\n                      \u25bc\n              JarvisAgent.chat_stream()\n                      \u2502\n            \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n            \u2502                    \u2502\n            \u25bc                    \u25bc\n      FLM NPU (:52625)    Fused Engine (:9090)\n      Qwen3-0.6B          (fallback)\n            \u2502                    \u2502\n            \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                      \u2502\n                      \u25bc\n              Streaming response\n                      \u2502\n                      \u25bc\n              Web UI (browser)\n```\n\n## Voice Flow (STT)\n\n```\nMicrophone \u2500\u2500\u25b6 Web Audio API \u2500\u2500\u25b6 PCM bytes \u2500\u2500\u25b6 WebSocket \"stt\"\n                                                      \u2502\n                                                      \u25bc\n                                              whisper.cpp server\n                                              or FLM /v1/audio/transcriptions\n                                                      \u2502\n                                                      \u25bc\n                                              Transcribed text\n                                                      \u2502\n                                                      \u25bc\n                                              Chat flow (above)\n```\n\n## Voice Flow (TTS)\n\n```\nLLM Response \u2500\u2500\u25b6 WebSocket {type:\"tts\", text:\"...\"}\n                        \u2502\n                        \u25bc\n                 PiperVoice.synthesize(text)\n                        \u2502\n                        \u25bc\n                 WAV bytes \u2500\u2500\u25b6 WebSocket audio chunk\n                        \u2502\n                        \u25bc\n                 Web Audio API playback\n```\n\n## Vision Flow\n\n```\nImage + Text \u2500\u2500\u25b6 WebSocket /api/chat\n                      \u2502\n                      \u25bc\n              User content with image_url\n              (base64-JPEG data URI)\n                      \u2502\n                      \u25bc\n              LLM processes multimodal input\n              (Qwen3-VL-4B via FLM)\n                      \u2502\n                      \u25bc\n              Streaming text response\n```\n\n## RAG Flow\n\n```\nUser Query \u2500\u2500\u25b6 agent.rag_query(query)\n                      \u2502\n                      \u25bc\n              knowledge.search(query)\n              (full-text on content+title+tags)\n                      \u2502\n                      \u25bc\n              Top-K results formatted as context\n                      \u2502\n                      \u25bc\n              Prepended to LLM prompt\n                      \u2502\n                      \u25bc\n              Chat flow (above)\n```\n\n## Tool Execution Flow\n\n```\nLLM generates tool call \u2500\u2500\u25b6 agent._execute_tool()\n              \u2502\n    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n    \u25bc         \u25bc         \u25bc\nCalculator  Python    File Ops\n              \u2502\n    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n    \u25bc                   \u25bc\nResult             Error message\n    \u2502\n    \u25bc\nInjected back into LLM context\n```\n\n## Citations\n\n[1] [Chat](/capabilities/chat.md)\n[2] [Voice I/O](/capabilities/voice.md)\n[3] [RAG](/capabilities/rag.md)\n[4] [Tool Calling](/capabilities/tool_calling.md)", "architecture/server_stack": "# Overview\n\nThe JARVIS server is a Python FastAPI application (`server/server.py`) serving as the orchestration layer between the web UI and inference engines.\n\n## Source Files\n\n| File | Purpose |\n|------|---------|\n| `server/server.py` | FastAPI app, HTTP/WS endpoints, file upload, knowledge API |\n| `server/agent.py` | JarvisAgent \u2014 LLM orchestration, tool calling, conversation memory |\n| `server/knowledge.py` | OpenKnowledge \u2014 CRUD, full-text search, markdown persistence |\n| `server/voice.py` | VoiceIO \u2014 Whisper STT + Piper TTS |\n| `server/config.py` | JarvisConfig \u2014 dataclass + env-driven load_config() |\n\n## Key Endpoints\n\n### HTTP\n\n| Endpoint | Method | Purpose |\n|----------|--------|---------|\n| `/` or `/chat` | GET | Serve web UI (index.html) |\n| `/api/status` | GET | System status \u2014 check NPU, GPU, TTS backends |\n| `/api/chat` | POST | Send message (form data), stream NDJSON response |\n| `/api/upload` | POST | Upload file for RAG or vision |\n| `/api/knowledge/*` | GET/POST/DELETE | Knowledge base CRUD + search |\n\n### WebSocket\n\n| Endpoint | Purpose |\n|----------|---------|\n| `/ws/chat` | Bidirectional streaming: chat, STT, TTS, RAG, clear |\n\nMessage types:\n- `message` \u2014 Chat text (optionally with base64 image)\n- `stt` \u2014 Audio bytes \u2192 transcribed text\n- `tts` \u2014 Text \u2192 synthesized audio bytes\n- `rag_query` \u2014 Query string \u2192 knowledge results\n- `clear` \u2014 Reset conversation\n\n## Conversation Memory\n\nPer-session message history stored in `conversations` dict (in-memory). Up to `max_history` (50) messages. Trimmed oldest-first (system prompt always preserved).\n\n## Citations\n\n[1] [System Architecture](/architecture/system_architecture.md)\n[2] [Data Flow](/architecture/data_flow.md)\n[3] [API Reference](/references/api_reference.md)", "architecture/system_architecture": "# Overview\n\nJARVIS is a fully-local private AI assistant running on the 1bit.systems fused NPU+GPU+CPU stack. Three layers: web frontend, Python orchestrator, inference engines.\n\n## Layer Diagram\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              JARVIS Web UI (any browser)          \u2502\n\u2502  Chat \u00b7 Voice \u00b7 Vision \u00b7 RAG \u00b7 Tools \u00b7 Status     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                       \u2502 HTTP / WebSocket :8080\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502            JARVIS Orchestrator (Python)           \u2502\n\u2502  FastAPI \u00b7 Agent \u00b7 Knowledge \u00b7 TTS/STT \u00b7 Vision  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                       \u2502 HTTP :52625 (FLM) / :9090 (Fused)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502            Fused Engine (C++ / Zig)              \u2502\n\u2502   NPU (XDNA2) \u2190\u2192 GPU (Radeon 8060S) \u2190\u2192 CPU     \u2502\n\u2502   Qwen3-0.6B \u00b7 Whisper \u00b7 Piper \u00b7 Qwen3-VL-4B    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n## Layer 1: Web UI\n\nSingle-page HTML/JS application at `web/index.html`. Communicates with the orchestrator via HTTP POST (`/api/chat`) and WebSocket (`/ws/chat`). No build step \u2014 open the file directly.\n\n## Layer 2: Python Orchestrator\n\nFastAPI server at `server/server.py` with:\n\n- **Agent** (`server/agent.py`) \u2014 LLM orchestration with conversation memory, tool calling, RAG integration\n- **Knowledge** (`server/knowledge.py`) \u2014 Open Knowledge Format: CRUD, full-text search, markdown persistence\n- **Voice** (`server/voice.py`) \u2014 Whisper STT + Piper TTS\n- **Config** (`server/config.py`) \u2014 Environment-driven configuration\n\n## Layer 3: Inference Engines\n\n- **NPU (FLM)**: Primary chat path, 94 tok/s on XDNA2\n- **Fused Engine**: Unified daemon on port 9090 (fallback path)\n- **GPU (llama.cpp)**: Via Radeon 8060S Vulkan backend\n- **CPU (Zen 5)**: Piper TTS, file operations\n\n## Citations\n\n[1] [Server Stack](/architecture/server_stack.md)\n[2] [Data Flow](/architecture/data_flow.md)\n[3] [Fused Engine](https://github.com/1bit-systems/1bit/tree/main/engine/fusion/) \u2014 the underlying NPU+GPU hybrid engine", "capabilities/chat": "# Overview\n\nPrimary chat capability powered by the NPU (XDNA2) running Qwen3-0.6B at 94 tok/s via FLM.\n\n## Models\n\n| Model | Backend | Speed | Purpose |\n|-------|---------|-------|---------|\n| Qwen3-0.6B | FLM NPU (:52625) | 94 tok/s | Primary chat |\n| Qwen3-0.6B-NPU2 | Fused Engine (:9090) | 97 tok/s | Fallback (C++ v12) |\n| Qwen3-VL-4B | FLM NPU | 11 tok/s | Vision + chat |\n\n## Streaming\n\nResponses are streamed via:\n- **HTTP**: `POST /api/chat` returns `application/x-ndjson` (newline-delimited JSON)\n- **WebSocket**: `ws://host:8080/ws/chat` with bidirectional streaming\n\nEach chunk: `{\"type\": \"chunk\", \"text\": \"...\"}` with final `{\"type\": \"done\", \"session_id\": \"...\"}`.\n\n## Conversation Memory\n\n- In-memory per-session history\n- Max 50 messages, system prompt always preserved\n- Session ID passed by client or auto-generated\n\n## Backend Selection\n\n1. Try FLM NPU on port 52625 first\n2. Fall back to Fused Engine on port 9090\n3. Return error message if both unreachable\n\n## Citations\n\n[1] [System Architecture](/architecture/system_architecture.md)\n[2] [Voice I/O](/capabilities/voice.md)\n[3] [Vision](/capabilities/vision.md)", "capabilities/configuration": "# Overview\n\nJARVIS is configured via environment variables (loaded by `server/config.py` \u2192 `load_config()`).\n\n## Environment Variables\n\n| Variable | Default | Description |\n|----------|---------|-------------|\n| `JARVIS_API_BASE` | `http://127.0.0.1:9090` | Fused Engine API base URL |\n| `JARVIS_LLM_MODEL` | `qwen3:0.6b` | LLM model ID for FLM |\n| `JARVIS_PORT` | `8080` | JARVIS server port |\n| `JARVIS_DEBUG` | `1` | Enable debug logging |\n\n## Config Dataclass\n\n| Field | Default | Description |\n|-------|---------|-------------|\n| `api_base` | `http://127.0.0.1:9090` | Unified daemon endpoint |\n| `flm_port` | `52625` | FLM NPU server port |\n| `llm_model` | `qwen3:0.6b` | Primary chat model |\n| `vision_model` | `qwen3vl-it:4b` | Vision model |\n| `embed_model` | `embed-gemma:300m` | Embedding model |\n| `asr_model` | `whisper-v3:turbo` | Speech recognition model |\n| `host` | `0.0.0.0` | Server bind address |\n| `port` | `8080` | Server port |\n| `max_history` | `50` | Max conversation messages |\n| `max_tokens` | `2048` | Max response tokens |\n| `temperature` | `0.7` | LLM temperature |\n| `tools_enabled` | `[calculator, web_search, python_exec, read_file, list_dir]` | Available tools |\n\n## Citations\n\n[1] [Quick Start](/guides/quick_start.md)\n[2] [Server Stack](/architecture/server_stack.md)", "capabilities/open_knowledge": "# Overview\n\nJARVIS uses the Open Knowledge Format (OKF) \u2014 a transparent, file-based knowledge system. Every piece of knowledge is a human-readable `.md` file with YAML frontmatter.\n\n## Directory Structure\n\n```\ndata/knowledge/\n\u251c\u2500\u2500 index.json              # Full-text search index (auto-generated)\n\u251c\u2500\u2500 index.md                # OKF bundle index (manual)\n\u251c\u2500\u2500 conversations/          # Chat histories (markdown logs)\n\u251c\u2500\u2500 documents/              # Uploaded RAG documents\n\u251c\u2500\u2500 facts/                  # Structured facts JARVIS learned\n\u251c\u2500\u2500 tools/                  # Tool output snapshots\n\u251c\u2500\u2500 architecture/           # System architecture docs (OKF concepts)\n\u251c\u2500\u2500 capabilities/           # Capability docs (OKF concepts)\n\u251c\u2500\u2500 guides/                 # Setup guides (OKF concepts)\n\u2514\u2500\u2500 references/             # Reference docs (OKF concepts)\n```\n\n## File Format\n\n```markdown\n---\ntype: fact | document | conversation | tool_output\ncreated: 2026-07-05T18:30:00Z\ntags: [npu, performance, benchmark]\nsource: user | web | tool | inference\nconfidence: 0.0-1.0\n---\n# Title\nContent in markdown...\n```\n\n## CRUD Operations\n\nAll exposed via HTTP API:\n\n- `GET /api/knowledge/search?q=query` \u2014 Full-text search\n- `GET /api/knowledge/list?type=fact` \u2014 List by type\n- `GET /api/knowledge/read?path=...` \u2014 Read entry\n- `POST /api/knowledge/add` \u2014 Create entry\n- `DELETE /api/knowledge/delete` \u2014 Delete entry\n\n## Index\n\nAuto-generated `index.json` with:\n- Version, format metadata\n- Entry list with type, title, tags, source, confidence\n- Size tracking\n\n## Citations\n\n[1] [RAG](/capabilities/rag.md)\n[2] [Knowledge Format](/references/knowledge_format.md)\n[3] [OKF Specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)", "capabilities/rag": "# Overview\n\nRAG enables JARVIS to answer questions using its stored knowledge \u2014 facts, documents, conversation logs, and tool outputs \u2014 by retrieving relevant entries and injecting them into the LLM prompt.\n\n## Search Engine\n\nFull-text keyword search on:\n\n| Field | Weight |\n|-------|--------|\n| Title | \u00d73 per match |\n| Tags | \u00d72 per match |\n| Content body | \u00d70.5 per occurrence |\n\nSource: `server/knowledge.py` \u2192 `OpenKnowledge.search()`\n\n## Knowledge Types\n\n| Type | Directory | Purpose |\n|------|-----------|---------|\n| `fact` | `knowledge/facts/` | Structured facts learned about the system |\n| `document` | `knowledge/documents/` | Uploaded RAG documents |\n| `conversation` | `knowledge/conversations/` | Chat history logs |\n| `tool_output` | `knowledge/tools/` | Tool execution snapshots |\n\n## RAG Query Flow\n\n1. User sends `rag_query` via WebSocket\n2. `agent.rag_query()` calls `knowledge.search(query, top_k=5)`\n3. Results formatted as markdown sections with type badges\n4. Context prepended to LLM system message\n5. LLM generates answer informed by knowledge\n\n## Citations\n\n[1] [Data Flow](/architecture/data_flow.md)\n[2] [Open Knowledge](/capabilities/open_knowledge.md)\n[3] [Knowledge Format](/references/knowledge_format.md)", "capabilities/tool_calling": "# Overview\n\nJARVIS can execute tools on demand when the LLM generates tool calls. Tools are executed locally via Python.\n\n## Available Tools\n\n| Tool | Function | Description |\n|------|----------|-------------|\n| `calculator` | `_tool_calculator()` | Safe math expression evaluation |\n| `python_exec` | `_tool_python_exec()` | Execute arbitrary Python code |\n| `read_file` | `_tool_read_file()` | Read file contents (up to 4KB) |\n| `list_dir` | `_tool_list_dir()` | List directory contents |\n| `web_search` | `_tool_web_search()` | Web search query |\n\nEnabled via `config.tools_enabled` list.\n\n## Tool Result Flow\n\n1. LLM generates a tool call with name + arguments JSON\n2. `agent._execute_tool()` routes to the appropriate handler\n3. Result (or error) returned as `ToolResult`\n4. Injected back into LLM context for follow-up\n\n## Security\n\n- **Calculator**: Restricted to math operations only \u2014 no `__builtins__`\n- **Python exec**: Full `builtins` available \u2014 caution advised\n- **Read file**: Capped at 4000 chars\n- **List dir**: Capped at 50 entries\n\n## Citations\n\n[1] [Tool Reference](/references/tool_reference.md)\n[2] [Server Stack](/architecture/server_stack.md)", "capabilities/vision": "# Overview\n\nJARVIS supports multimodal vision: send an image with your message and it will describe, analyze, or answer questions about it.\n\n## Model\n\n- **Model**: Qwen3-VL-4B\n- **Backend**: NPU via FLM\n- **Speed**: ~11 tok/s\n- **Config key**: `vision_model: \"qwen3vl-it:4b\"`\n\n## How It Works\n\n1. User sends text + image (via HTTP file upload or WebSocket base64)\n2. Image is converted to base64 data URI (`data:image/jpeg;base64,...`)\n3. LLM message content is a list: `[{type: \"text\"}, {type: \"image_url\"}]`\n4. FLM NPU processes multimodal input\n5. Response streamed back as text\n\n## Upload Endpoints\n\n```bash\n# Via HTTP upload\ncurl -X POST http://localhost:8080/api/upload \\\n  -F \"file=@photo.jpg\" \\\n  -F \"category=image\"\n\n# Via WebSocket with image\n{\n  \"type\": \"message\",\n  \"text\": \"What's in this image?\",\n  \"image\": \"<base64-encoded-jpeg>\"\n}\n```\n\n## Citations\n\n[1] [Data Flow](/architecture/data_flow.md)\n[2] [Chat](/capabilities/chat.md)", "capabilities/voice": "# Overview\n\nJARVIS supports bidirectional voice I/O: speak to it (STT) and hear its responses (TTS), all locally.\n\n## Speech-to-Text (Whisper)\n\nTwo paths:\n\n| Path | Binary | Model | Latency |\n|------|--------|-------|---------|\n| whisper.cpp | `whisper-server` | `ggml-base.en.bin` | ~1.5s |\n| FLM NPU | FLM API | `whisper-v3:turbo` | ~1s |\n\nSource: `server/voice.py` \u2192 `VoiceIO.stt()`\n\n## Text-to-Speech (Piper)\n\n- Engine: [Piper TTS](https://github.com/rhasspy/piper)\n- Voice: `en_US-lessac-medium`\n- Latency: ~50ms\n- Voice models at: `~/.local/share/piper/voices/`\n\nSource: `server/voice.py` \u2192 `VoiceIO.tts()`\n\n## WebSocket Protocol\n\n```json\n// STT: send audio bytes\n{\"type\": \"stt\", \"audio\": \"<base64-encoded-wav>\"}\n// Response\n{\"type\": \"stt_result\", \"text\": \"transcribed text\"}\n\n// TTS: send text\n{\"type\": \"tts\", \"text\": \"Text to speak\"}\n// Response\n{\"type\": \"tts_result\", \"audio\": \"<base64-encoded-wav>\"}\n```\n\n## Citations\n\n[1] [Data Flow](/architecture/data_flow.md)\n[2] [Server Stack](/architecture/server_stack.md)", "facts/JARVIS_Demo_Fact_20260705_214249": "# JARVIS Demo Fact\n\nJARVIS successfully demonstrated all capabilities on 2026-07-05. Running on 1bit.systems NPU+GPU+CPU stack.", "facts/JARVIS_Demo_Fact_20260705_214346": "# JARVIS Demo Fact\n\nJARVIS successfully demonstrated all capabilities on 2026-07-05. Running on 1bit.systems NPU+GPU+CPU stack.", "guides/deployment": "# Deployment\n\n## Self-Hosted (Default)\n\nJust run the server:\n\n```bash\npython3 server/server.py\n```\n\nJARVIS listens on `0.0.0.0:8080` by default. Access from any device on your LAN.\n\n## Cloudflare Pages (Web UI Only)\n\nThe static web UI can be deployed to Cloudflare Pages:\n\n```bash\ncd ~/jarvis\n./deploy.sh\n```\n\nThe `wrangler.toml` configures the deployment. Note: the API server must still run locally or on a reachable host.\n\n## Subdomain Setup\n\n```bash\ncd ~/jarvis\n./scripts/setup-subdomain.sh\n```\n\n## Production Considerations\n\n- Run behind a reverse proxy (nginx/Caddy) for TLS\n- Set `JARVIS_DEBUG=0` in production\n- Consider systemd service for auto-restart\n- TTS voices downloaded via API: `POST /api/tts/download`\n\n## Citations\n\n[1] [Quick Start](/guides/quick_start.md)\n[2] [Configuration](/capabilities/configuration.md)", "guides/quick_start": "# Quick Start\n\n## Prerequisites\n\n- 1bit.systems AMD Strix Halo laptop with NPU\n- FLM server installed\n- Python 3.14+ with venv\n\n## Step 1: Start NPU Backend\n\n```bash\nsudo flm serve qwen3:0.6b --port 52625 --pmode turbo\n```\n\nThis starts the NPU inference engine on port 52625.\n\n## Step 2: Activate Environment\n\n```bash\nsource ~/jarvis-env/bin/activate\n```\n\nOr the project venv:\n\n```bash\ncd ~/jarvis\nsource venv/bin/activate\n```\n\n## Step 3: Launch JARVIS\n\n```bash\ncd ~/jarvis\npython3 server/server.py\n```\n\nOpen [http://localhost:8080/chat](http://localhost:8080/chat) in any browser.\n\n## Verify\n\n```bash\ncurl http://localhost:8080/api/status\n```\n\nExpected response includes `fused_engine.ok: true`, `flm_npu.ok: true`, and knowledge stats.\n\n## Citations\n\n[1] [Configuration](/capabilities/configuration.md)\n[2] [Deployment](/guides/deployment.md)\n[3] [Demo Script](https://github.com/1bit-systems/jarvis/blob/main/scripts/demo.sh)", "references/api_reference": "# API Reference\n\n## HTTP Endpoints\n\n### GET `/api/status`\n\nSystem health check. Returns backend status for fused engine, FLM NPU, and TTS.\n\n```bash\ncurl http://localhost:8080/api/status\n```\n\n### POST `/api/chat`\n\nSend a chat message (form data). Returns streaming NDJSON.\n\n```bash\ncurl -X POST http://localhost:8080/api/chat \\\n  -F \"message=Hello\" \\\n  -F \"session_id=abc123\"\n```\n\n**Parameters**:\n- `message` (required): Text message\n- `session_id` (optional): Session identifier\n- `image` (optional): Image file upload\n\n### POST `/api/upload`\n\nUpload a file.\n\n```bash\ncurl -X POST http://localhost:8080/api/upload \\\n  -F \"file=@document.pdf\" \\\n  -F \"category=rag\"\n```\n\n**Parameters**:\n- `file` (required): File data\n- `category` (required): `rag` or `image`\n\n### GET `/api/knowledge/search`\n\nSearch the knowledge base.\n\n```bash\ncurl \"http://localhost:8080/api/knowledge/search?q=npu+benchmark&max=5\"\n```\n\n### GET `/api/knowledge/stats`\n\nKnowledge base statistics.\n\n### GET `/api/knowledge/list`\n\nList all entries, optionally filtered by type.\n\n```bash\ncurl \"http://localhost:8080/api/knowledge/list?type=fact\"\n```\n\n### GET `/api/knowledge/read`\n\nRead a specific entry by path.\n\n```bash\ncurl \"http://localhost:8080/api/knowledge/read?path=data/knowledge/facts/my_fact.md\"\n```\n\n### POST `/api/knowledge/add`\n\nCreate a new knowledge entry (form data).\n\n### DELETE `/api/knowledge/delete`\n\nDelete a knowledge entry by path.\n\n### POST `/api/tts/download`\n\nDownload a TTS voice model.\n\n## WebSocket `/ws/chat`\n\nBidirectional streaming protocol. Message types:\n\n| Type | Direction | Payload |\n|------|-----------|---------|\n| `message` | Client\u2192Server | `{text, session_id?, image?}` |\n| `stt` | Client\u2192Server | `{audio: \"<base64>\"}` |\n| `tts` | Client\u2192Server | `{text}` |\n| `rag_query` | Client\u2192Server | `{query}` |\n| `clear` | Client\u2192Server | `{session_id}` |\n| `chunk` | Server\u2192Client | `{text, session_id}` |\n| `done` | Server\u2192Client | `{session_id}` |\n| `stt_result` | Server\u2192Client | `{text}` |\n| `tts_result` | Server\u2192Client | `{audio: \"<base64>\"}` |\n| `rag_result` | Server\u2192Client | `{results}` |\n| `cleared` | Server\u2192Client | `{session_id}` |\n\n## Citations\n\n[1] [Server Stack](/architecture/server_stack.md)\n[2] [Tool Reference](/references/tool_reference.md)", "references/knowledge_format": "# Knowledge Format Reference\n\n## File Path Convention\n\n```\ndata/knowledge/{type}/{slug}_{YYYYMMDD_HHMMSS}.md\n```\n\nWhere `{slug}` is the title sanitized (spaces \u2192 underscores, non-alphanumeric removed).\n\n## Frontmatter Fields\n\n| Field | Required | Type | Description |\n|-------|----------|------|-------------|\n| `type` | Yes | string | `fact`, `document`, `conversation`, or `tool_output` |\n| `created` | Auto | ISO 8601 | Creation timestamp |\n| `updated` | Auto | ISO 8601 | Last update timestamp |\n| `tags` | No | list | Search keywords |\n| `source` | No | string | `user`, `web`, `tool`, or `inference` |\n| `confidence` | No | float | 0.0\u20131.0 confidence score |\n\n## Body Format\n\nStandard markdown. First `# Heading` becomes the title.\n\n```markdown\n# Title\nBody content in markdown...\n```\n\n## Index\n\n`index.json` auto-generated with all entries for fast lookup:\n\n```json\n{\n  \"version\": 2,\n  \"format\": \"open-knowledge-markdown\",\n  \"updated\": \"2026-07-05T18:30:00Z\",\n  \"entry_count\": 42,\n  \"entries\": {\n    \"data/knowledge/facts/example_20260705_183000.md\": {\n      \"type\": \"fact\",\n      \"title\": \"Example Fact\",\n      \"tags\": [\"npu\", \"performance\"],\n      \"source\": \"inference\",\n      \"confidence\": 0.9,\n      \"created\": \"2026-07-05T18:30:00Z\",\n      \"size_bytes\": 512\n    }\n  }\n}\n```\n\n## Citations\n\n[1] [Open Knowledge](/capabilities/open_knowledge.md)\n[2] [OKF Specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)", "references/tool_reference": "# Tool Reference\n\n## calculator\n\nSafe math expression evaluator.\n\n```json\n{\n  \"name\": \"calculator\",\n  \"arguments\": \"{\\\"expression\\\": \\\"2 + 2 * 3\\\"}\"\n}\n```\n\n**Security**: Restricted to `math` module functions plus `abs`, `pow`, `round`, `min`, `max`, `sum`, `len`. No `__builtins__`.\n\n## python_exec\n\nExecute arbitrary Python code.\n\n```json\n{\n  \"name\": \"python_exec\",\n  \"arguments\": \"{\\\"code\\\": \\\"print('hello world')\\\"}\"\n}\n```\n\n**Security**: Full `builtins` available. Output captured from stdout.\n\n## read_file\n\nRead file contents.\n\n```json\n{\n  \"name\": \"read_file\",\n  \"arguments\": \"{\\\"path\\\": \\\"/home/bcloud/jarvis/server/server.py\\\"}\"\n}\n```\n\n**Limits**: 4000 character cap on output.\n\n## list_dir\n\nList directory contents.\n\n```json\n{\n  \"name\": \"list_dir\",\n  \"arguments\": \"{\\\"path\\\": \\\"/home/bcloud/jarvis\\\"}\"\n}\n```\n\n**Limits**: 50 entry cap on output.\n\n## web_search\n\nSearch the web.\n\n```json\n{\n  \"name\": \"web_search\",\n  \"arguments\": \"{\\\"query\\\": \\\"NPU benchmarks 2026\\\"}\"\n}\n```\n\n**Note**: Currently returns a stub message. Full integration with browser tool pending.\n\n## Citations\n\n[1] [Tool Calling](/capabilities/tool_calling.md)\n[2] [API Reference](/references/api_reference.md)"}, "types": ["Architecture", "Capability", "Guide", "Reference", "fact"]};
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [...BUNDLE.nodes, ...BUNDLE.edges],
  style: [
    { selector: 'node', style: { 'background-color': 'data(color)', 'label': 'data(label)', 'text-valign': 'center', 'text-halign': 'center', 'color': '#e2e8f0', 'font-size': '12px', 'width': 'data(size)', 'height': 'data(size)', 'text-wrap': 'wrap', 'text-max-width': '100' } },
    { selector: 'edge', style: { 'width': 1.5, 'line-color': '#475569', 'target-arrow-color': '#475569', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.8 } },
    { selector: ':selected', style: { 'border-width': 3, 'border-color': '#fbbf24' } }
  ],
  layout: { name: 'cose', nodeRepulsion: () => 8000, idealEdgeLength: () => 120 },
  minZoom: 0.3, maxZoom: 3, wheelSensitivity: 0.3
});

document.getElementById('bundle-name').textContent = BUNDLE_NAME;

const typeSelect = document.getElementById('filter-type');
for (const t of BUNDLE.types || []) {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t;
  typeSelect.appendChild(opt);
}

document.getElementById('layout').addEventListener('change', e => {
  cy.layout({ name: e.target.value, nodeRepulsion: () => 8000, idealEdgeLength: () => 120 }).run();
});

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  cy.nodes().forEach(n => {
    const d = n.data();
    const match = !q || d.label.toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || (d.tags || []).some(t => t.toLowerCase().includes(q));
    n.style({ opacity: match ? 1 : 0.2 });
  });
});

document.getElementById('reset').addEventListener('click', () => {
  cy.fit(50);
  cy.nodes().style({ opacity: 1 });
  document.getElementById('search').value = '';
  document.getElementById('filter-type').value = '';
});

let selectedNode = null;
cy.on('tap', 'node', e => {
  const n = e.target;
  const d = n.data();
  selectedNode = d.id;
  document.getElementById('detail-empty').hidden = true;
  document.getElementById('detail-content').hidden = false;
  document.getElementById('detail-type').textContent = d.type || 'Unknown';
  document.getElementById('detail-type').style.backgroundColor = d.color || '#94a3b8';
  document.getElementById('detail-title').textContent = d.label || d.id;
  document.getElementById('detail-id').textContent = d.id;
  document.getElementById('detail-description').textContent = d.description || '(none)';
  const res = document.getElementById('detail-resource');
  if (d.resource) {
    const a = document.createElement('a');
    a.href = d.resource; a.textContent = d.resource; a.target = '_blank';
    res.innerHTML = ''; res.appendChild(a);
  } else { res.textContent = '(none)'; }
  document.getElementById('detail-tags').textContent = (d.tags || []).join(', ') || '(none)';
  const body = BUNDLE.bodies[d.id] || '';
  const html = marked.parse(body);
  document.getElementById('detail-body').innerHTML = html;
  // Rewire internal links
  document.getElementById('detail-body').querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.endsWith('.md') && !h.startsWith('http')) {
      a.addEventListener('click', e => { e.preventDefault();
        const targetId = h.replace(/\//g, '/').replace(/\.md$/,'').replace(/^\.\//,'');
        const node = cy.getElementById(targetId);
        if (node.length) { cy.animate({ center: { eles: node }, zoom: 2 }); /* tap it */ }
      });
    }
  });
  // Backlinks
  const bl = BUNDLE.edges.filter(e => e.data.target === d.id).map(e => e.data.source);
  const blSection = document.getElementById('detail-backlinks');
  if (bl.length) {
    blSection.hidden = false;
    const list = document.getElementById('backlinks-list');
    list.innerHTML = '';
    for (const src of bl) {
      const srcNode = BUNDLE.nodes.find(n => n.data.id === src);
      const label = srcNode ? srcNode.data.label : src;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#'; a.textContent = label;
      a.addEventListener('click', e => { e.preventDefault();
        const node = cy.getElementById(src);
        if (node.length) { cy.animate({ center: { eles: node }, zoom: 2 }); }
      });
      li.appendChild(a); list.appendChild(li);
    }
  } else { blSection.hidden = true; }
});

cy.on('tap', e => { if (e.target === cy) { selectedNode = null; } });
</script>
</body>
</html>
