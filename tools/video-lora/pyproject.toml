[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "video-lora"
version = "0.2.0"
description = "Model-agnostic video generation with LoRA support — 14+ models auto-detected"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "diffusers>=0.32",
    "transformers>=4.46",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "opencv-python>=4.9",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]
wan = [
    # videox-fun from git (install manually)
]
vulkan = [
    # zig build -p $PWD/install  (builds video-lora-vk binary)
    # No Python deps — pure Zig + GLSL
]
ltx = [
    "ltx-video>=0.9",
]
animate = [
    "imageio[ffmpeg]>=2.34",
]
cogvideo = [
    # CogVideoX is in diffusers core — no extra deps
]
hunyuan = [
    # HunyuanVideo is in diffusers core — no extra deps
]
ltx2 = [
    # LTX2 is in diffusers core — no extra deps
]
sana = [
    # Sana Video is in diffusers core — no extra deps
]
mochi = [
    # Mochi is in diffusers core — no extra deps
]
easyanimate = [
    # EasyAnimate is in diffusers core — no extra deps
]
cosmos = [
    # Cosmos is in diffusers core — no extra deps
]
allegro = [
    # Allegro is in diffusers core — no extra deps
]
motif = [
    # Motif Video is in diffusers core — no extra deps
]
consisid = [
    # ConsisID is in diffusers core — no extra deps
]
skyreels = [
    # SkyReels V2 is in diffusers core — no extra deps
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/video_lora"]
